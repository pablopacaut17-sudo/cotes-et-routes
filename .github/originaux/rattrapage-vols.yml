name: Rattrapage des journées manquantes (vols OpenSky)

on:
  schedule:
    - cron: "10 13 * * *"
    - cron: "10 19 * * *"
  push:
    paths:
      - ".github/workflows/rattrapage-vols.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: archive-vols
  cancel-in-progress: false

jobs:
  rattrapage:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Relever à nouveau une journée absente ou incomplète
        env:
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
          RATTRAPAGE_MAX_MIN: "170"
        run: |
          cat > /tmp/rattrapage.py <<'PYEOF'
          #!/usr/bin/env python3
          """Cotes & Routes : rattrapage des journées manquantes ou incomplètes de l'archive des vols (OpenSky).
          À chaque passage : repère une journée absente ou anormalement faible, la relève à nouveau (départs et arrivées
          des 300 principaux aéroports), puis recalcule entièrement les statistiques cumulées à partir de l'archive.
          Ne remplace une journée que si la nouvelle relève contient plus de vols. S'arrête proprement si le quota est atteint."""
          import json, os, sys, time, datetime, pathlib, gzip, statistics, urllib.request, urllib.parse, urllib.error

          TOKEN_URL = "https://auth.opensky-network.org/auth/realms/opensky-network/protocol/openid-connect/token"
          API = "https://opensky-network.org/api/flights/"
          D = pathlib.Path("data"); F = D / "flights"; TMP = pathlib.Path("/tmp/rattrapage")
          N_AIRPORTS = int(os.environ.get("OPENSKY_AIRPORTS", "300"))
          SEUIL = 0.6
          Q = {"quota": False}  # une journée est « incomplète » sous 60 % de la médiane des journées récentes

          def lire(p, d):
              try: return json.loads(pathlib.Path(p).read_text(encoding="utf-8"))
              except Exception: return d

          def token():
              cid, sec = os.environ.get("OPENSKY_CLIENT_ID"), os.environ.get("OPENSKY_CLIENT_SECRET")
              if not cid or not sec: print("Secrets OpenSky absents : rien à faire."); sys.exit(0)
              data = urllib.parse.urlencode({"grant_type": "client_credentials", "client_id": cid, "client_secret": sec}).encode()
              with urllib.request.urlopen(urllib.request.Request(TOKEN_URL, data=data), timeout=60) as r: return json.loads(r.read())["access_token"]

          def airports():
              ap = lire(D / "airports.json", {})["airports"]; rt = lire(D / "routes.json", {})["routes"]
              icao = {a[0]: a[1] for a in ap if a[1] and len(a[1]) == 4}
              return [icao[c] for c in sorted((c for c in rt if c in icao), key=lambda c: -len(rt[c]))[:N_AIRPORTS]]

          def cible():
              idx = lire(F / "index.json", {}); n = idx.get("days", {}); fichiers = sorted(p.name[:10] for p in F.glob("*.json.gz"))
              if not fichiers: return None
              debut = datetime.date.fromisoformat(fichiers[0]); fin = (datetime.datetime.now(datetime.timezone.utc) - datetime.timedelta(days=2)).date()
              tous = [str(debut + datetime.timedelta(days=i)) for i in range((fin - debut).days + 1)]
              deja = lire(F / "rattrapage.json", {}).get("essais", {})
              ref = [v for k, v in sorted(n.items())[-30:] if v] or [0]; med = statistics.median(ref)
              manquants = [d for d in tous if d not in n or d not in fichiers]
              faibles = [d for d in tous if d in n and n[d] < SEUIL * med]
              for d in sorted(manquants, reverse=True) + sorted(faibles, reverse=True):  # le plus récent d’abord
                  if deja.get(d, 0) < 4: return d, n.get(d, 0), med
              return None

          def relever(day):
              """Relève en parallèle (4 aéroports à la fois) avec une limite de temps ; s'arrête proprement au quota."""
              import threading, concurrent.futures
              begin = int(datetime.datetime(day.year, day.month, day.day, tzinfo=datetime.timezone.utc).timestamp()); end = begin + 86400
              T0 = time.time(); LIMITE = float(os.environ.get("RATTRAPAGE_MAX_MIN", "170")) * 60
              etat = {"tok": token(), "t": time.time(), "rest": None, "cout": 30, "mode": "jour"}; verrou = threading.Lock(); Q["quota"] = False
              def jeton():
                  with verrou:
                      if time.time() - etat["t"] > 1500: etat["tok"], etat["t"] = token(), time.time()
                      return etat["tok"]
              def brut(kind, icao, b, e):
                  req = urllib.request.Request(f"{API}{kind}?airport={icao}&begin={b}&end={e}", headers={"Authorization": f"Bearer {jeton()}"})
                  try:
                      with urllib.request.urlopen(req, timeout=120) as r:
                          rest = r.headers.get("X-Rate-Limit-Remaining")
                          if rest is not None:
                              with verrou: etat["rest"] = int(rest)
                          return json.loads(r.read() or b"[]")
                  except urllib.error.HTTPError as x:
                      rest = x.headers.get("X-Rate-Limit-Remaining") if x.headers else None
                      if rest is not None:
                          with verrou: etat["rest"] = int(rest)
                      raise
              def get(kind, icao):
                  if etat["mode"] == "moities":
                      m = begin + 43200; out = []
                      for b, e in ((begin, m - 1), (m, end - 1)):
                          try: out += brut(kind, icao, b, e)
                          except urllib.error.HTTPError as x:
                              if x.code != 404: raise
                      return out
                  return brut(kind, icao, begin, end - 1)
              L = airports()
              try:
                  ic = L[0]; brut("departure", ic, begin, begin + 43199); r1 = etat["rest"]; brut("departure", ic, begin + 43200, end - 1); r2 = etat["rest"]; brut("departure", ic, begin, end - 1); r3 = etat["rest"]
                  if None not in (r1, r2, r3):
                      demi, jour = max(0, r1 - r2), max(0, r2 - r3)
                      if 2 * demi < jour: etat["mode"], etat["cout"] = "moities", 2 * demi
                      else: etat["cout"] = jour or 30
                  print(f"Crédits OpenSky restants : {etat['rest']} ; mode {etat['mode']}, coût par demande ≈ {etat['cout']}")
              except urllib.error.HTTPError as x:
                  if x.code == 429:
                      ra = x.headers.get("X-Rate-Limit-Retry-After-Seconds") if x.headers else None
                      Q["quota"] = True; print("Plus de crédits OpenSky pour le moment" + (f" (de nouveau disponibles dans {round(int(ra) / 3600, 1)} h)" if ra else "") + " : nouvel essai au prochain passage."); return 0, {}, {}, {}
              except Exception as x: print("Étalonnage impossible :", x)
              def un(icao):
                  if Q["quota"] or time.time() - T0 > LIMITE: return icao, None, None
                  if etat["rest"] is not None and etat["rest"] < etat["cout"]: Q["quota"] = True; return icao, None, None
                  try: fl = get("departure", icao)
                  except urllib.error.HTTPError as e:
                      if e.code == 404: fl = []
                      else:
                          if e.code == 429: Q["quota"] = True
                          return icao, None, None
                  except Exception: return icao, None, None
                  ar = None
                  if not Q["quota"] and (etat["rest"] is None or etat["rest"] >= etat["cout"]):
                      try: ar = get("arrival", icao)
                      except urllib.error.HTTPError as e:
                          if e.code == 404: ar = []
                          elif e.code == 429: Q["quota"] = True
                      except Exception: pass
                  time.sleep(0.5)
                  return icao, fl, ar
              detail, arrivees, res, ok = {}, {}, {}, 0
              with concurrent.futures.ThreadPoolExecutor(max_workers=4) as ex:
                  for icao, fl, ar in ex.map(un, L):
                      if fl is None: continue
                      detail[icao] = [[f.get("icao24") or "", (f.get("callsign") or "").strip(), f.get("estArrivalAirport") or "", f.get("firstSeen") or 0, f.get("lastSeen") or 0] for f in fl]
                      dest, airl = {}, {}
                      for f in fl:
                          if f.get("estArrivalAirport"): dest[f["estArrivalAirport"]] = dest.get(f["estArrivalAirport"], 0) + 1
                          cs = (f.get("callsign") or "").strip()
                          if len(cs) >= 4 and cs[:3].isalpha(): airl[cs[:3]] = airl.get(cs[:3], 0) + 1
                      res[icao] = {"dep": len(fl), "dest": dict(sorted(dest.items(), key=lambda x: -x[1])[:40]), "airl": dict(sorted(airl.items(), key=lambda x: -x[1])[:15])}
                      if ar is not None:
                          arrivees[icao] = [[f.get("icao24") or "", (f.get("callsign") or "").strip(), f.get("estDepartureAirport") or "", f.get("firstSeen") or 0, f.get("lastSeen") or 0] for f in ar]
                          res[icao]["arr"] = len(ar)
                      ok += 1
              print(f"Relève : {ok} aéroports en {round((time.time() - T0) / 60)} min" + (" (quota atteint)" if Q["quota"] else ""))
              return ok, detail, arrivees, res

          def statistiques(tmap):
              """Recalcule les statistiques cumulées à partir de toute l'archive (même structure que le robot quotidien)."""
              st = {"counted": [], "flights": 0, "airports": {}, "pairs": {}, "airlines": {}, "hours": [0] * 24, "months": {}, "weekdays": [0] * 7, "ap": {}, "al": {}, "ty": {}, "arr_ty": {}}
              def blk(d, key): return d.setdefault(key, {"n": 0, "hours": [0] * 24, "weekdays": [0] * 7, "months": {}, "days": {}, "top": {}})
              for p in sorted(F.glob("*.json.gz")):
                  day = p.name[:10]
                  try:
                      with gzip.open(p, "rt", encoding="utf-8") as g: detail = json.load(g).get("airports", {})
                  except Exception as e: print("Fichier illisible", p.name, e); continue
                  for icao, fl in detail.items():
                      st["airports"][icao] = st["airports"].get(icao, 0) + len(fl)
                      A = blk(st["ap"], icao); A["days"][day] = len(fl)
                      for f in fl:
                          st["flights"] += 1; A["n"] += 1
                          cs = f[1]; pref = cs[:3] if len(cs) >= 4 and cs[:3].isalpha() else None
                          if f[2]: k = icao + "|" + f[2]; st["pairs"][k] = st["pairs"].get(k, 0) + 1
                          tc = tmap.get((f[0] or "").lower())
                          if tc:
                              T = st["ty"].setdefault(tc, {"n": 0, "days": {}, "top": {}, "arr": {}, "al": {}}); T["n"] += 1
                              T["days"][day] = T["days"].get(day, 0) + 1; T["top"][icao] = T["top"].get(icao, 0) + 1
                              if f[2]: T["arr"][f[2]] = T["arr"].get(f[2], 0) + 1
                              if pref: T["al"][pref] = T["al"].get(pref, 0) + 1
                              A.setdefault("ty", {}); A["ty"][tc] = A["ty"].get(tc, 0) + 1
                              if f[2]: X = st["arr_ty"].setdefault(f[2], {}); X[tc] = X.get(tc, 0) + 1
                          if pref:
                              st["airlines"][pref] = st["airlines"].get(pref, 0) + 1; A["top"][pref] = A["top"].get(pref, 0) + 1
                              B = blk(st["al"], pref); B["n"] += 1; B["top"][icao] = B["top"].get(icao, 0) + 1; B["days"][day] = B["days"].get(day, 0) + 1
                          if f[3]:
                              t = datetime.datetime.fromtimestamp(f[3], datetime.timezone.utc); m = t.strftime("%Y-%m")
                              st["hours"][t.hour] += 1; st["weekdays"][t.weekday()] += 1; st["months"][m] = st["months"].get(m, 0) + 1
                              A["hours"][t.hour] += 1; A["weekdays"][t.weekday()] += 1; A["months"][m] = A["months"].get(m, 0) + 1
                              if pref: B["hours"][t.hour] += 1; B["weekdays"][t.weekday()] += 1; B["months"][m] = B["months"].get(m, 0) + 1
                  st["counted"].append(day)
              st["pairs"] = dict(sorted(st["pairs"].items(), key=lambda x: -x[1])[:20000])
              st["airlines"] = dict(sorted(st["airlines"].items(), key=lambda x: -x[1])[:2000])
              for d in list(st["ap"].values()) + list(st["al"].values()):
                  d["top"] = dict(sorted(d["top"].items(), key=lambda x: -x[1])[:20]); d["days"] = dict(sorted(d["days"].items())[-400:])
              st["al"] = dict(sorted(st["al"].items(), key=lambda x: -x[1]["n"])[:1500])
              for T in st["ty"].values():
                  T["top"] = dict(sorted(T["top"].items(), key=lambda x: -x[1])[:25]); T["days"] = dict(sorted(T["days"].items())[-400:])
                  T["arr"] = dict(sorted(T["arr"].items(), key=lambda x: -x[1])[:25]); T["al"] = dict(sorted(T["al"].items(), key=lambda x: -x[1])[:25])
              for A_ in st["ap"].values():
                  if "ty" in A_: A_["ty"] = dict(sorted(A_["ty"].items(), key=lambda x: -x[1])[:25])
              st["arr_ty"] = {k: dict(sorted(v.items(), key=lambda x: -x[1])[:20]) for k, v in sorted(st["arr_ty"].items(), key=lambda kv: -sum(kv[1].values()))[:3000]}
              return st

          def appliquer():
              """Range la journée relevée dans l'archive et recalcule index et statistiques (rejouable après un git reset)."""
              m = lire(TMP / "jour.json", None)
              if not m: return False
              day = m["day"]; gz = TMP / "jour.json.gz"; idx = lire(F / "index.json", {})
              if idx.get("days", {}).get(day, 0) >= m["dep"] and (F / f"{day}.json.gz").exists(): print("Journée déjà complète :", day); return False
              F.mkdir(parents=True, exist_ok=True); (F / f"{day}.json.gz").write_bytes(gz.read_bytes())
              o = lire(D / "opensky.json", {"days": {}}); o.setdefault("days", {})[day] = m["res"]; o["days"] = dict(sorted(o["days"].items())[-400:])
              (D / "opensky.json").write_text(json.dumps(o, ensure_ascii=False, separators=(",", ":")), encoding="utf-8")
              idx.setdefault("days", {})[day] = m["dep"]; idx.setdefault("arrivals_days", {})[day] = m["arr"]
              idx["days"] = dict(sorted(idx["days"].items())); idx["arrivals_days"] = dict(sorted(idx["arrivals_days"].items()))
              idx["online"] = sorted(p.name[:10] for p in F.glob("*.json.gz")); idx["total_flights"] = sum(idx["days"].values())
              idx.setdefault("fields_per_flight", 5); idx.setdefault("fields", ["icao24", "indicatif", "arrivee_oaci", "premiere_detection_utc", "derniere_detection_utc"])
              (F / "index.json").write_text(json.dumps(idx, separators=(",", ":")), encoding="utf-8")
              st = statistiques(lire(D / "icao24-type.json", {}))
              (F / "stats.json").write_text(json.dumps(st, separators=(",", ":")), encoding="utf-8")
              r = lire(F / "rattrapage.json", {"essais": {}, "journal": []}); r["journal"] = (r.get("journal", []) + [{"jour": day, "avant": m["avant"], "apres": m["dep"], "arrivees": m["arr"], "le": m["le"]}])[-200:]
              (F / "rattrapage.json").write_text(json.dumps(r, ensure_ascii=False, indent=1), encoding="utf-8")
              print(f"{day} rattrapé : {m['avant']} → {m['dep']} départs, {m['arr']} arrivées ; statistiques recalculées sur {len(st['counted'])} jours")
              return True

          def main():
              if len(sys.argv) > 1 and sys.argv[1] == "appliquer": sys.exit(0 if appliquer() else 3)
              maint = datetime.datetime.utcnow()
              try: dern = pathlib.Path("data/logs/opensky.txt").read_text(encoding="utf-8").split("\n")[0].split(" : ")[1][:16]
              except Exception: dern = ""
              seuil = maint.replace(hour=10, minute=0, second=0, microsecond=0).strftime("%Y-%m-%d %H:%M")
              if maint.hour < 12 or dern < seuil:
                  print(f"Le relevé quotidien OpenSky n’est pas encore passé aujourd’hui (dernier : {dern or 'inconnu'}) : rattrapage reporté pour lui laisser les crédits."); sys.exit(3)
              c = cible()
              if not c: print("Archive complète : aucune journée à rattraper."); sys.exit(3)
              day, avant, med = c; print(f"Journée à rattraper : {day} ({avant} départs, médiane {med:.0f})")
              ok, detail, arrivees, res = relever(datetime.date.fromisoformat(day))
              dep = sum(len(v) for v in detail.values()); arr = sum(len(v) for v in arrivees.values())
              r = lire(F / "rattrapage.json", {"essais": {}, "journal": []}); r.setdefault("essais", {})
              if not Q["quota"]: r["essais"][day] = r["essais"].get(day, 0) + 1
              (F / "rattrapage.json").write_text(json.dumps(r, ensure_ascii=False, indent=1), encoding="utf-8")
              if ok < 20 or dep <= avant:
                  print(f"Relève incomplète ({ok} aéroports, {dep} départs) : journée conservée telle quelle, nouvel essai au prochain passage."); sys.exit(0)
              TMP.mkdir(exist_ok=True)
              with gzip.open(TMP / "jour.json.gz", "wt", encoding="utf-8") as g: json.dump({"day": day, "airports": detail, "arrivals": arrivees}, g, separators=(",", ":"))
              (TMP / "jour.json").write_text(json.dumps({"day": day, "dep": dep, "arr": arr, "avant": avant, "res": res, "le": datetime.date.today().isoformat()}), encoding="utf-8")
              appliquer()

          if __name__ == "__main__": main()
          PYEOF
          git config user.name "robot-cotes-et-routes"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          set +e
          python3 /tmp/rattrapage.py 2>&1 | tee /tmp/rattrapage.log; rc=${PIPESTATUS[0]}
          set -e
          journal() { mkdir -p data/logs; { echo "Dernier passage du rattrapage : $(date -u '+%Y-%m-%d %H:%M UTC') (code $rc)"; cat /tmp/rattrapage.log; } | tail -c 20000 > data/logs/rattrapage.txt; }
          journal
          git add data/opensky.json data/flights data/logs/rattrapage.txt
          if git diff --cached --quiet; then echo "Rien de nouveau"; exit 0; fi
          git commit -qm "Rattrapage d'une journee de l'archive des vols"
          for essai in 1 2 3 4 5 6; do
            if git push; then exit 0; fi
            sleep 20
            git fetch -q origin main && git reset -q --hard origin/main
            python3 /tmp/rattrapage.py appliquer || true
            journal
            git add data/opensky.json data/flights data/logs/rattrapage.txt
            git diff --cached --quiet && exit 0
            git commit -qm "Rattrapage d'une journee de l'archive des vols"
          done
          exit 1

          
