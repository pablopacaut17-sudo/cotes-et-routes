name: "Kérosène, Bourse, prix des billets, emploi, quotas CO2"

on:
  schedule:
    - cron: "7 22 * * *"
  push:
    paths:
      - ".github/workflows/economie-plus.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: economie-plus
  cancel-in-progress: false

jobs:
  robot:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collecter
        run: |
          pip install -q xlrd openpyxl
          mkdir -p /tmp/robot
          cat > /tmp/robot/commun.py <<'PYEOF'
          import json, os, re, io, csv, sys, time, gzip, zipfile, bz2, datetime, pathlib, urllib.request, urllib.parse, urllib.error
          D = pathlib.Path("data"); O = D / "officiel"; O.mkdir(parents=True, exist_ok=True)
          JOUR = datetime.date.today(); LOGS = []
          UA = {"User-Agent": "Cotes-et-Routes/1.0 (site aviation ; github.com/pablopacaut17-sudo/cotes-et-routes)"}
          def log(*a):
              m = " ".join(str(x) for x in a); print(m, flush=True); LOGS.append(m)
          def get(u, t=180, data=None, h=None, essais=3):
              for k in range(essais):
                  try:
                      req = urllib.request.Request(u, data=data, headers={**UA, **(h or {})})
                      with urllib.request.urlopen(req, timeout=t) as r: return r.read()
                  except urllib.error.HTTPError as e:
                      if e.code in (400, 401, 403, 404, 410): raise
                      time.sleep(8 * (k + 1))
                  except Exception:
                      if k == essais - 1: raise
                      time.sleep(8 * (k + 1))
              raise RuntimeError("indisponible " + u)
          def gj(u, t=180, **k): return json.loads(get(u, t, **k))
          def ecrire(p, o):
              p = pathlib.Path(p); p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(json.dumps(o, ensure_ascii=False, separators=(",", ":")), encoding="utf-8")
          def liens(page_url, motif, html=None):
              html = html if html is not None else get(page_url, 60).decode("utf-8", "ignore")
              out = []
              for h in re.findall(r'href=["\']([^"\']+)["\']', html, re.I):
                  u = urllib.parse.urljoin(page_url, h.replace("&amp;", "&"))
                  if re.search(motif, u, re.I) and u not in out: out.append(u)
              return out
          def nombre(x):
              x = str(x or "").strip().replace(" ", "").replace("\xa0", "").replace(" ", "")
              if not x or x in ("-", ".", ".."): return None
              if re.fullmatch(r"-?\d{1,3}(,\d{3})+(\.\d+)?", x): x = x.replace(",", "")
              elif "," in x and "." not in x: x = x.replace(",", ".")
              try: return float(x)
              except ValueError: return None
          def csv_lignes(texte):
              texte = texte.lstrip("﻿"); tete = texte[:5000]
              sep = max([";", ",", "\t", "|"], key=lambda s: tete.count(s))
              return list(csv.DictReader(io.StringIO(texte), delimiter=sep))
          def decode(b):
              for enc in ("utf-8", "cp1252", "latin-1"):
                  try: return b.decode(enc)
                  except UnicodeDecodeError: pass
              return b.decode("utf-8", "ignore")
          def journal(nom):
              (D / "logs").mkdir(parents=True, exist_ok=True)
              (D / "logs" / f"{nom}.txt").write_text(f"Dernier passage : {datetime.datetime.utcnow():%Y-%m-%d %H:%M} UTC\n" + "\n".join(LOGS)[-20000:], encoding="utf-8")
          def etape(nom, f):
              t0 = time.time()
              try: f(); log(f"✔ {nom} ({round(time.time() - t0)} s)")
              except Exception as e: log(f"✘ {nom} : {type(e).__name__} {str(e)[:300]}")
          def eurostat(ds, params):
              js = gj("https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/" + ds + "?" + urllib.parse.urlencode(params, doseq=True), 300)
              if "value" not in js: return []
              ids, size = js["id"], js["size"]; cats = []
              for d in ids:
                  idx = js["dimension"][d]["category"]["index"]; cats.append({p: c for c, p in idx.items()} if isinstance(idx, dict) else dict(enumerate(idx)))
              out = []
              for flat, val in js["value"].items():
                  flat = int(flat); co = []
                  for n in reversed(size): co.append(flat % n); flat //= n
                  co.reverse(); out.append({**{ids[i]: cats[i][co[i]] for i in range(len(ids))}, "v": val})
              return out
          PYEOF
          cat > /tmp/robot/robot.py <<'PYEOF'
          from commun import *
          NAV = {"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"}
          def eia():
              import xlrd
              o = {}
              for k, code in (("kerosene_usd_gallon", "EER_EPJK_PF4_RGC_DPGd"), ("brent_usd_baril", "RBRTEd")):
                  b = get(f"https://www.eia.gov/dnav/pet/hist_xls/{code}.xls", 120, h=NAV); sh = xlrd.open_workbook(file_contents=b).sheet_by_name("Data 1"); S = {}
                  for r in range(3, sh.nrows):
                      d, v = sh.cell_value(r, 0), sh.cell_value(r, 1)
                      if isinstance(d, float) and isinstance(v, float):
                          j = xlrd.xldate_as_datetime(d, 0).date()
                          if j.year >= 2015: S[j.isoformat()] = round(v, 3)
                  o[k] = S; log(f"  {k} : {len(S)} jours")
              ecrire(O / "carburant.json", {"maj": JOUR.isoformat(), "source": "EIA (agence américaine de l’énergie) : kérosène Jet du golfe du Mexique et Brent, prix au comptant", **o})
          BOURSE = [("AF.PA", "Air France-KLM"), ("AIR.PA", "Airbus"), ("SAF.PA", "Safran"), ("HO.PA", "Thales"), ("AM.PA", "Dassault Aviation"), ("ADP.PA", "Aéroports de Paris"), ("LHA.DE", "Lufthansa"), ("IAG.L", "IAG (British Airways, Iberia)"), ("EZJ.L", "easyJet"), ("RYAAY", "Ryanair"), ("RR.L", "Rolls-Royce"), ("BA", "Boeing"), ("GE", "GE Aerospace"), ("ERJ", "Embraer"), ("DAL", "Delta Air Lines"), ("UAL", "United Airlines"), ("AAL", "American Airlines"), ("LUV", "Southwest"), ("QAN.AX", "Qantas"), ("C6L.SI", "Singapore Airlines"), ("0293.HK", "Cathay Pacific"), ("THYAO.IS", "Turkish Airlines"), ("9201.T", "Japan Airlines"), ("FLU.VI", "Flughafen Wien")]
          def bourse():
              R = {}
              def yahoo(t):
                  for hote in ("query2", "query1"):
                      try:
                          j = gj(f"https://{hote}.finance.yahoo.com/v8/finance/chart/{urllib.parse.quote(t)}?range=5y&interval=1wk", 60, h=NAV, essais=1)["chart"]["result"][0]
                          c = j["indicators"]["quote"][0]["close"]
                          return j["meta"].get("currency", ""), {datetime.datetime.utcfromtimestamp(ts).date().isoformat(): round(v, 2) for ts, v in zip(j["timestamp"], c) if v is not None}
                      except Exception as e: err.append(f"{hote} {str(e)[:40]}")
              def stooq(t):
                  base, _, place = t.partition(".")
                  s = base.lower() + "." + {"PA": "fr", "DE": "de", "L": "uk", "AX": "au", "SI": "sg", "HK": "hk", "IS": "tr", "T": "jp", "VI": "at", "": "us"}.get(place, "us")
                  try:
                      L = csv_lignes(decode(get(f"https://stooq.com/q/d/l/?s={s}&i=w", 60, h=NAV, essais=1)))
                      S = {l["Date"]: round(nombre(l["Close"]), 2) for l in L if l.get("Date") and nombre(l.get("Close")) and l["Date"] >= str(JOUR.year - 5)}
                      if S: return "", S
                      err.append("stooq vide")
                  except Exception as e: err.append(f"stooq {str(e)[:40]}")
              def nasdaq(t):
                  if "." in t: return None
                  try:
                      j = gj(f"https://api.nasdaq.com/api/quote/{t}/historical?assetclass=stocks&fromdate={JOUR.year - 5}-01-01&limit=9999", 60, h={**NAV, "Accept": "application/json"}, essais=1)
                      S = {}
                      for r in ((j.get("data") or {}).get("tradesTable") or {}).get("rows") or []:
                          m, d, a = r["date"].split("/"); S[f"{a}-{m}-{d}"] = nombre(r["close"].replace("$", ""))
                      k = sorted(S); S = {x: S[x] for i, x in enumerate(k) if i % 5 == 0 or i == len(k) - 1}
                      if S: return "USD", S
                      err.append("nasdaq vide")
                  except Exception as e: err.append(f"nasdaq {str(e)[:40]}")
              for t, nom in BOURSE:
                  err = []
                  r = yahoo(t) or nasdaq(t) or stooq(t)
                  if r: R[t] = {"nom": nom, "devise": r[0], "semaines": r[1]}
                  else: log(f"  {nom} ({t}) indisponible : {' | '.join(err)}")
                  time.sleep(1)
              log(f"  Bourse : {len(R)} sociétés sur {len(BOURSE)}")
              if not R: raise RuntimeError("aucun cours")
              ecrire(O / "bourse.json", {"maj": JOUR.isoformat(), "source": "Yahoo Finance, Nasdaq ou Stooq, cours de clôture hebdomadaires (information, pas un conseil d’investissement)", "societes": R})
          def essai(ds, variantes):
              for p in variantes:
                  try:
                      L = eurostat(ds, p)
                      if L: log(f"  {ds} {p} : {len(L)} valeurs"); return L
                  except Exception as e: log(f"  {ds} {p} : {str(e)[:60]}")
              return []
          def billets():
              G = ["FR", "DE", "ES", "IT", "BE", "NL", "EU27_2020"]; base = {"freq": "M", "unit": "I15", "geo": G, "sinceTimePeriod": "2015-01"}
              L = essai("prc_hicp_midx", [{**base, "coicop": "CP0733"}, {**base, "coicop18": "CP0733"}, {**base, "unit": "I25", "coicop18": "CP0733"}])
              if not L: L = essai("prc_hicp_minr", [{**base, "unit": "I25", "coicop18": "CP0733"}, {**base, "unit": "I25", "coicop": "CP0733"}])
              R = {}
              for x in L: R.setdefault(x["geo"], {})[x["time"]] = round(x["v"], 2)
              if not R: raise RuntimeError("indice introuvable")
              ecrire(O / "prix-billets.json", {"maj": JOUR.isoformat(), "source": "Eurostat, indice des prix à la consommation harmonisé : transport aérien de passagers (base 100 = moyenne de l’année de référence)", "pays": {k: dict(sorted(v.items())) for k, v in R.items()}})
          def emploi():
              L = essai("sbs_ovw_act", [{"nace_r2": "H51", "indic_sbs": "EMP_NR"}, {"nace_r2": "H51", "indic_sbs": "EMP_NR", "size_emp": "TOTAL"}])
              if not L: L = essai("sbs_na_1a_se_r2", [{"nace_r2": "H51", "indic_sb": "V16110"}])
              R = {}
              for x in L:
                  if x.get("geo") and x["v"]: R.setdefault(x["geo"], {})[x["time"]] = round(x["v"])
              if not R: raise RuntimeError("emploi introuvable")
              ecrire(O / "emploi.json", {"maj": JOUR.isoformat(), "source": "Eurostat, statistiques structurelles des entreprises : personnes employées dans le transport aérien (NACE H51)", "pays": R})
          def ets():
              import openpyxl
              page = "https://climate.ec.europa.eu/eu-action/eu-emissions-trading-system-eu-ets/union-registry_en"
              U = [u for u in liens(page, r"\.xlsx?(\?|$)|/document/download|/system/files", get(page, 60, h=NAV).decode("utf-8", "ignore")) if re.search(r"verified|compliance|emission", u, re.I)] or liens(page, r"\.xlsx(\?|$)")
              U = sorted(U, key=lambda u: (0 if "verified" in u.lower() else 1, -int((re.findall(r"20\d\d", u) or ["0"])[-1]), 0 if "xlsx" in u else 1)); log("  fichiers :", [u.rsplit("=", 1)[-1] for u in U[:6]])
              for u in U[:6]:
                  try: wb = openpyxl.load_workbook(io.BytesIO(get(u, 300, h=NAV, essais=2)), read_only=True, data_only=True)
                  except Exception as e: log("  illisible", u.rsplit('=', 1)[-1], str(e)[:80]); continue
                  for ws in wb.worksheets:
                      rows = ws.iter_rows(values_only=True); tete = None; R = {}; AV = []
                      for r in rows:
                          cel = [str(c or "").strip() for c in r]
                          if tete is None:
                              if any(re.search(r"main[ _]?activity|activity[ _]?type", c, re.I) for c in cel): tete = cel; ia = next(i for i, c in enumerate(cel) if re.search(r"main[ _]?activity|activity[ _]?type", c, re.I)); ih = next((i for i, c in enumerate(cel) if re.search(r"account[ _]?holder|installation[ _]?name|aircraft[ _]?operator", c, re.I)), 0); ip = next((i for i, c in enumerate(cel) if re.search(r"registry|country", c, re.I)), None); iv = [(i, re.search(r"(20\d\d)", c).group(1)) for i, c in enumerate(cel) if re.search(r"verified.*20\d\d|20\d\d.*verified", c, re.I)]
                              continue
                          if not re.match(r"10\b|aircraft|aviation", cel[ia], re.I): continue
                          e = {a: nombre(r[i]) for i, a in iv if nombre(r[i])}
                          if e: AV.append((cel, e))
                      if tete is None: log("  feuille", ws.title, ": en-tête non trouvé"); continue
                      cand = [i for i, c in enumerate(tete) if re.search(r"name|holder|operator|nom", c, re.I)] or [ih]
                      ih = max(cand, key=lambda i: sum(1 for c, e in AV if len(re.findall(r"[A-Za-z]", c[i])) >= 4))
                      for c, e in AV:
                          if len(re.findall(r"[A-Za-z]", c[ih])) >= 3: R[c[ih][:80]] = {"pays": c[ip] if ip is not None else "", "emissions": e}
                      log("  feuille", ws.title, ": colonnes", tete[:14], "nom pris dans", tete[ih], ",", len(iv), "années,", len(R), "exploitants")
                      if len(R) > 50:
                          ecrire(O / "ets-compagnies.json", {"maj": JOUR.isoformat(), "source": "Commission européenne, registre de l’Union (SEQE-UE) : émissions vérifiées des exploitants d’aéronefs, en tonnes de CO₂", "url": u, "exploitants": R}); log(f"  ETS : {len(R)} exploitants"); return
              raise RuntimeError("fichier des émissions vérifiées non reconnu")
          def boeing():
              h = ""
              for page in ("https://www.boeing.com/commercial/orders-deliveries", "https://www.boeing.com/commercial", "https://investors.boeing.com/investors/news/default.aspx"):
                  try: h = get(page, 60, h=NAV, essais=1).decode("utf-8", "ignore"); break
                  except Exception as e: log("  ", page, str(e)[:40])
              U = liens(page, r"\.(xlsx|csv|json)(\?|$)", h); log("  liens :", U[:8])
              import openpyxl
              for u in U:
                  if not re.search(r"order|deliver|ood", u, re.I): continue
                  try:
                      b = get(u, 120, h=NAV, essais=1)
                      if u.lower().split("?")[0].endswith("xlsx"):
                          wb = openpyxl.load_workbook(io.BytesIO(b), read_only=True, data_only=True)
                          F = [{"nom": ws.title, "lignes": [[c if isinstance(c, (int, float)) else str(c or "") for c in r][:16] for r in ws.iter_rows(values_only=True) if any(r)][:3000]} for ws in wb.worksheets[:4]]
                      else: F = [{"nom": "données", "lignes": [list(l.values())[:16] for l in csv_lignes(decode(b))][:3000]}]
                      ecrire(O / "boeing.json", {"maj": JOUR.isoformat(), "source": "Boeing, commandes et livraisons d’avions commerciaux", "page": page, "feuilles": F}); log("  Boeing :", u); return
                  except Exception as e: log("  ", u, str(e)[:60])
              raise RuntimeError("fichier Boeing introuvable (page chargée par JavaScript)")
          for nom, f in (("Kérosène et pétrole", eia), ("Bourse", bourse), ("Prix des billets", billets), ("Emploi", emploi), ("Quotas CO2 ETS", ets), ("Boeing", boeing)): etape(nom, f)
          journal("economie-plus")
          PYEOF
          PYTHONPATH=/tmp/robot python /tmp/robot/robot.py
      - name: Enregistrer
        if: always()
        run: |
          git config user.name "robot-cotes-et-routes"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then echo "Rien de nouveau"; exit 0; fi
          git commit -qm "Économie du transport aérien"
          for essai in 1 2 3 4 5 6; do
            if git push; then exit 0; fi
            sleep 15
            git pull -q --rebase -X theirs origin main || git rebase --abort
          done
          exit 1
          
