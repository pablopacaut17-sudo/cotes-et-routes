name: Bourse (sociétés européennes et asiatiques)

on:
  schedule:
    - cron: "47 23 * * *"
    - cron: "47 5 * * *"
  push:
    paths:
      - ".github/workflows/bourse.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bourse
  cancel-in-progress: false

jobs:
  bourse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Cours des sociétés européennes et asiatiques
        run: |
          cat > /tmp/bourse.py <<'PYEOF'
          """Cotes & Routes : complément de la Bourse. Le robot « Kérosène, Bourse… » n'obtient plus que les sociétés cotées aux États-Unis
          (Yahoo et Stooq bloquent GitHub). Ce robot ajoute les autres : Euronext Paris pour les sociétés françaises et Airbus,
          et sinon le certificat américain (ADR) de la société via Nasdaq. Cours de clôture hebdomadaires sur 5 ans, en information seulement."""
          import json, re, io, csv, time, datetime, pathlib, urllib.request, urllib.parse
          O = pathlib.Path('data/officiel')
          F, C = (O / 'bourse.json', O / 'bourse-complement.json')
          LOG = pathlib.Path('data/logs/bourse.txt')
          NAV = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0 Safari/537.36'}
          JOUR = datetime.date.today()
          # ticker du site : (nom, code ISIN sur Euronext Paris ou None, certificat américain ou None)
          SOC = {'AF.PA': ('Air France-KLM', 'FR001400J770', 'AFLYY'), 'AIR.PA': ('Airbus', 'NL0000235190', 'EADSY'),
                 'SAF.PA': ('Safran', 'FR0000073272', 'SAFRY'), 'HO.PA': ('Thales', 'FR0000121329', 'THLLY'),
                 'AM.PA': ('Dassault Aviation', 'FR0014004L86', None), 'ADP.PA': ('Aéroports de Paris', 'FR0010340141', None),
                 'LHA.DE': ('Lufthansa', None, 'DLAKY'), 'IAG.L': ('IAG (British Airways, Iberia)', None, 'ICAGY'),
                 'EZJ.L': ('easyJet', None, 'ESYJY'), 'RR.L': ('Rolls-Royce', None, 'RYCEY'), 'ERJ': ('Embraer', None, 'ERJ'),
                 'QAN.AX': ('Qantas', None, 'QABSY'), 'C6L.SI': ('Singapore Airlines', None, 'SINGY'),
                 '0293.HK': ('Cathay Pacific', None, 'CPCAY'), 'THYAO.IS': ('Turkish Airlines', None, 'TKHVY'),
                 '9201.T': ('Japan Airlines', None, 'JAPSY'), 'FLU.VI': ('Flughafen Wien', None, None)}
          journal = []

          def log(*m):
              s = ' '.join(str(x) for x in m)
              print(s, flush=True)
              journal.append(s)

          def get(u, data=None, h=None):
              req = urllib.request.Request(u, data=data, headers={**NAV, **(h or {})})
              with urllib.request.urlopen(req, timeout=60) as r:
                  return r.read()

          def nombre(x):
              x = str(x or '').strip().replace('$', '').replace('\xa0', '').replace(' ', '')
              try:
                  return float(x.replace(',', '.')) if x.count(',') == 1 and '.' not in x else float(x.replace(',', ''))
              except ValueError:
                  return None

          def hebdo(S):
              """garde le dernier cours de chaque semaine"""
              W = {}
              for d in sorted(S):
                  y, w, _ = datetime.date.fromisoformat(d).isocalendar()
                  W[(y, w)] = d
              return {d: round(S[d], 2) for d in sorted(W.values())}

          def euronext(isin):
              debut = f'{JOUR.year - 5}-01-01'
              u = f'https://live.euronext.com/en/ajax/AwlHistoricalPrice/getFullDownloadAjax/{isin}-XPAR'
              p = {'format': 'csv', 'decimal_separator': '.', 'date_form': 'd/m/Y', 'op': '', 'adjusted': 'Y', 'base100': '', 'startdate': debut, 'enddate': JOUR.isoformat()}
              texte = None
              for essai in ('post', 'get'):
                  try:
                      b = get(u, data=urllib.parse.urlencode(p).encode()) if essai == 'post' else get(u + '?' + urllib.parse.urlencode(p))
                      texte = b.decode('utf-8', 'ignore').lstrip('﻿')
                      if 'Date' in texte:
                          break
                  except Exception as e:
                      log(f'    Euronext ({essai}) : {type(e).__name__} {str(e)[:60]}')
              if not texte:
                  return None
              lignes = texte.splitlines()
              i = next((k for k, l in enumerate(lignes) if re.match(r'^\W*Date\W', l)), None)
              if i is None:
                  log('    Euronext : réponse sans tableau')
                  return None
              sep = max([';', ',', '\t'], key=lambda s: lignes[i].count(s))
              L = list(csv.DictReader(io.StringIO('\n'.join(lignes[i:])), delimiter=sep))
              col = next((c for c in (L[0].keys() if L else []) if c and c.strip().strip('"').lower() in ('close', 'last', 'clôture', 'dernier')), None)
              S = {}
              for l in L:
                  try:
                      dc = next(k for k in l if k and 'date' in k.lower())
                      j, m, a = re.findall(r'\d+', l[dc])[:3]
                      v = nombre(l[col])
                      if v:
                          S[f'{a}-{int(m):02d}-{int(j):02d}'] = v
                  except Exception:
                      continue
              return ('EUR', hebdo(S)) if len(S) > 50 else None

          def nasdaq(sym):
              for classe in ('stocks', 'etf'):
                  try:
                      j = json.loads(get(f'https://api.nasdaq.com/api/quote/{sym}/historical?assetclass={classe}&fromdate={JOUR.year - 5}-01-01&limit=9999', h={'Accept': 'application/json'}))
                      S = {}
                      for r in ((j.get('data') or {}).get('tradesTable') or {}).get('rows') or []:
                          m, d, a = r['date'].split('/')
                          v = nombre(r['close'])
                          if v:
                              S[f'{a}-{m}-{d}'] = v
                      if len(S) > 50:
                          return ('USD', hebdo(S))
                  except Exception as e:
                      log(f'    Nasdaq {sym} ({classe}) : {type(e).__name__} {str(e)[:60]}')
              return None

          def main():
              cache = json.loads(C.read_text(encoding='utf-8')) if C.exists() else {}
              for t, (nom, isin, adr) in SOC.items():
                  r, via = (None, '')
                  if isin:
                      r, via = (euronext(isin), 'Euronext Paris')
                  if not r and adr:
                      r, via = (nasdaq(adr), f'certificat américain {adr} (Nasdaq), en dollars')
                  if r:
                      cache[t] = {'nom': nom, 'devise': r[0], 'semaines': r[1], 'source': via, 'maj': JOUR.isoformat()}
                      log(f'✓ {nom} : {len(r[1])} semaines ({via})')
                  else:
                      log(f'✘ {nom} : aucune source' + (' (gardé de la dernière fois)' if t in cache else ''))
                  time.sleep(1)
              O.mkdir(parents=True, exist_ok=True)
              C.write_text(json.dumps(cache, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
              B = json.loads(F.read_text(encoding='utf-8')) if F.exists() else {'maj': JOUR.isoformat(), 'societes': {}}
              B.setdefault('societes', {})
              for t, v in cache.items():
                  if t not in B['societes'] or len(B['societes'][t].get('semaines') or {}) < 10:
                      B['societes'][t] = {k: v[k] for k in ('nom', 'devise', 'semaines')}
              B['source'] = 'Nasdaq, Euronext Paris (et certificats américains ADR pour certaines sociétés étrangères), cours de clôture hebdomadaires (information, pas un conseil d’investissement)'
              F.write_text(json.dumps(B, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
              log(f"Bourse : {len(B['societes'])} sociétés au total")
              LOG.parent.mkdir(parents=True, exist_ok=True)
              LOG.write_text('Dernier passage : ' + datetime.datetime.utcnow().strftime('%Y-%m-%d %H:%M UTC') + '\n' + '\n'.join(journal) + '\n', encoding='utf-8')
          if __name__ == '__main__':
              main()
          PYEOF
          git config user.name "robot-cotes-et-routes"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for essai in 1 2 3 4; do
            git fetch -q origin main && git reset -q --hard origin/main
            python /tmp/bourse.py
            [ -f "$GITHUB_WORKSPACE/.github/garde.py" ] && python3 "$GITHUB_WORKSPACE/.github/garde.py" || true
            git add data/officiel/bourse.json data/officiel/bourse-complement.json data/logs/bourse.txt 2>/dev/null || true
            if git diff --cached --quiet; then echo "Rien de nouveau"; exit 0; fi
            git commit -qm "Bourse : sociétés européennes et asiatiques"
            if git push -q; then exit 0; fi
            sleep 20
          done
          exit 1
          
