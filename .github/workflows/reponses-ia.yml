name: Réponses de l'IA à vérifier
# Chaque matin, avant la tâche d'amélioration : récupère auprès du relais IA les réponses données aux visiteurs
# (questions que le site ne savait pas traiter), les questions restées sans réponse et les erreurs signalées. La tâche d'amélioration de Claude les vérifie une par une avec des
# sources fiables et ajoute les justes au site ; elle note les autres comme écartées.
on:
  schedule:
    - cron: "7 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: reponses-ia, cancel-in-progress: false }
jobs:
  recuperer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Récupérer les nouvelles réponses
        run: |
          python3 - <<'PYEOF'
          import json, os, datetime, urllib.request
          F = "data/logs/ia-a-verifier.json"
          etat = json.load(open(F, encoding="utf-8")) if os.path.exists(F) else {"a_verifier": [], "traitees": []}
          deja = set(etat.get("traitees", [])) | {x["slug"] + "|" + x["q"] for x in etat.get("a_verifier", [])}
          depuis = (datetime.date.today() - datetime.timedelta(days=95)).isoformat()
          url = "https://relais-ia.pablopacaut17.workers.dev/?export=1&site=cotes-et-routes&depuis=" + depuis
          try:
              with urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": "robot-cotes-et-routes"}), timeout=60) as x:
                  d = json.loads(x.read())
          except Exception as e:
              print("Relais injoignable :", e); raise SystemExit(0)
          neuves = [x for x in d.get("reponses", []) if x["slug"] + "|" + x["q"] not in deja]
          # Questions restées sans réponse (à traiter en priorité) et réponses signalées fausses (pour le chasseur d'erreurs)
          for typ, cle in (("sansreponse", "sans_reponse"), ("signal", "signalements")):
              try:
                  with urllib.request.urlopen(urllib.request.Request(url.replace("?export=1", "?export=1&type=" + typ), headers={"User-Agent": "robot-cotes-et-routes"}), timeout=60) as x:
                      lst = json.loads(x.read()).get("liste", [])
              except Exception as e:
                  print(typ, ":", e); continue
              connus = {(y.get("slug", ""), y["q"], y.get("d")) for y in etat.get(cle, [])} | set(map(tuple, etat.get(cle + "_traites", [])))
              etat.setdefault(cle, []).extend(y for y in lst if (y.get("slug", ""), y["q"], y.get("d")) not in connus)
              print(typ, ":", len(etat[cle]), "à traiter")
          etat.setdefault("a_verifier", []).extend(neuves)
          etat["maj"] = datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ")
          os.makedirs(os.path.dirname(F), exist_ok=True)
          json.dump(etat, open(F, "w", encoding="utf-8"), ensure_ascii=False, indent=1)
          print(len(neuves), "nouvelle(s) réponse(s) ;", len(etat["a_verifier"]), "à vérifier")
          PYEOF
      - name: Enregistrer
        run: |
          git config user.name "robot-cotes-et-routes"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f "$GITHUB_WORKSPACE/.github/garde.py" ] && python3 "$GITHUB_WORKSPACE/.github/garde.py" || true
          git add data/logs/ia-a-verifier.json
          git diff --cached --quiet || (git commit -m "Réponses de l'IA à vérifier" && (git push || (git pull --rebase && git push)))
