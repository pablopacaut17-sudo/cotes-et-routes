name: "Questions-réponses (IA de GitHub)"

on:
  schedule:
    - cron: "41 1 * * *"
  push:
    paths:
      - ".github/workflows/faq.yml"
  workflow_dispatch:

permissions:
  contents: write
  models: read

concurrency:
  group: faq
  cancel-in-progress: false

jobs:
  faq:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Rédiger de nouvelles réponses
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/faq.py <<'PYEOF'
          """Cotes & Routes : robot questions-réponses. Chaque nuit, l'IA gratuite de GitHub (GitHub Models) rédige les réponses
          à de nouvelles questions d'aviation civile. La recherche du site trouve ensuite la question la plus proche."""
          import json, os, re, time, pathlib, datetime, unicodedata, urllib.request, urllib.error, random
          D = pathlib.Path("data/faq"); D.mkdir(parents=True, exist_ok=True); L = pathlib.Path("data/logs"); L.mkdir(parents=True, exist_ok=True)
          TOK = os.environ.get("GITHUB_TOKEN"); MODELE = os.environ.get("MODELE") or "openai/gpt-4o-mini"
          OBJECTIF = int(os.environ.get("OBJECTIF") or 150); APPELS_MAX = 140; TAILLE = 500; J = []
          def log(m): print(m, flush=True); J.append(m)
          THEMES = ["moteurs à réaction et turbopropulseurs", "hélices et moteurs à pistons", "aérodynamique et portance", "décollage et atterrissage", "météo et aviation", "turbulences et orages", "givrage", "navigation aérienne et GPS", "contrôle aérien", "radio et phraséologie", "instruments de bord et avionique", "pilote automatique", "sécurité aérienne et accidents célèbres", "enquêtes d’accidents", "histoire de l’aviation", "pionniers de l’aviation", "avions de ligne Airbus", "avions de ligne Boeing", "avions régionaux (ATR, Embraer, Bombardier)", "Concorde et vol supersonique", "aéroports et pistes", "codes IATA et OACI", "compagnies aériennes et alliances", "économie du transport aérien", "prix des billets", "cabine et confort des passagers", "pressurisation et altitude de croisière", "carburant et autonomie", "environnement, CO2 et bruit", "carburants durables et avion électrique", "fret aérien", "hélicoptères civils", "aviation légère et aéroclubs", "planeurs et vol à voile", "ULM et paramoteur", "montgolfières et dirigeables", "métiers de l’aviation", "devenir pilote de ligne", "maintenance des avions", "contrôle non destructif en aéronautique", "matériaux et composites", "train d’atterrissage et freins", "réglementation et licences", "droits des passagers", "sûreté et contrôles à l’aéroport", "bagages", "décalage horaire et santé en vol", "records d’aviation", "construction et assemblage des avions", "spotting et photographie d’avions", "vols long-courriers", "vol de nuit et éclairage des avions", "oiseaux et faune", "foudre et avions", "cartes aéronautiques", "espace aérien et zones", "aviation en France", "salons et meetings aériens", "musées de l’aviation", "simulateurs de vol"]
          VIDES = set("le la les l un une des de du d et ou a au aux en dans sur sous pour par avec sans est sont c ce cet cette ces qu que qui quoi quel quelle quels quelles comment pourquoi combien quand est-ce il elle ils on se sa son ses leur leurs plus moins tres bien faire fait peut peux veux savoir dire y ne pas t il".split())
          def nz(s): return re.sub(r"\s+", " ", re.sub(r"[^a-z0-9 ]", " ", unicodedata.normalize("NFD", s.lower()).encode("ascii", "ignore").decode())).strip()
          def jetons(s): return {w.rstrip("sx") if len(w) > 3 else w for w in nz(s).split() if w not in VIDES}
          APPELS = 0; DEBUT = time.time(); ECHECS = 0
          def ia(messages, maxt=3000):
              global APPELS, ECHECS
              for essai in range(3):
                  if APPELS >= APPELS_MAX or time.time() - DEBUT > 1500 or ECHECS >= 6: raise StopIteration
                  APPELS += 1
                  req = urllib.request.Request("https://models.github.ai/inference/chat/completions", data=json.dumps({"model": MODELE, "messages": messages, "temperature": 0.4, "max_tokens": maxt}).encode(),
                                               headers={"Authorization": "Bearer " + TOK, "Content-Type": "application/json", "Accept": "application/json"})
                  try:
                      t0 = time.time()
                      with urllib.request.urlopen(req, timeout=90) as r: t = json.loads(r.read())["choices"][0]["message"]["content"]
                      if APPELS <= 2: log(f"IA : réponse reçue en {time.time() - t0:.0f} s")
                      ECHECS = 0; time.sleep(4.5); return t
                  except urllib.error.HTTPError as e:
                      corps = e.read().decode("utf-8", "ignore")[:200]
                      if e.code == 429: log(f"Quota de l’IA atteint pour aujourd’hui ({corps[:100]})"); raise StopIteration
                      log(f"IA : erreur {e.code} {corps}"); ECHECS += 1
                      if e.code in (400, 401, 403, 404, 422): log("Problème de réglage de l’accès à l’IA : arrêt."); raise StopIteration
                      time.sleep(10)
                  except Exception as e: log(f"IA : {type(e).__name__} {str(e)[:150]}"); ECHECS += 1; time.sleep(10)
              return None
          def json_de(t):
              m = re.search(r"\[.*\]", t or "", re.S)
              try: return json.loads(m.group(0)) if m else None
              except Exception: return None
          SYS = ("Tu rédiges pour Cotes & Routes, une encyclopédie grand public de l’aviation civile en français. Pas d’aviation militaire, pas de drones. "
                 "Réponses justes, claires, sans jargon inutile, avec des chiffres et ordres de grandeur quand c’est utile ; n’invente jamais un chiffre précis dont tu n’es pas sûr (donne alors un ordre de grandeur et dis-le).")
          def principal():
              if not TOK: log("Jeton GitHub absent."); return
              I = json.loads((D / "index.json").read_text(encoding="utf-8")) if (D / "index.json").exists() else {"questions": [], "theme": 0}
              Q = I["questions"]; vus = [jetons(q[1]) for q in Q]; nouveaux = []
              def proche(q):
                  a = jetons(q)
                  return not a or any(len(a & b) / max(1, len(a | b)) > 0.6 for b in vus)
              seeds = [q for q in (os.environ.get("QUESTIONS") or "Quelle est la vitesse de rotation d’une turbine de réacteur et la vitesse en bout de pale ?").split("|") if q.strip()]
              file = [q for q in seeds if not proche(q)]
              t = I.get("theme", 0)
              try:
                  while len(nouveaux) < OBJECTIF:
                      if len(file) < 5:
                          th = THEMES[t % len(THEMES)]; t += 1
                          deja = [q[1] for q in Q if th.split()[0][:5].lower() in nz(q[1])][-40:]
                          r = json_de(ia([{"role": "system", "content": SYS}, {"role": "user", "content": f"Propose 20 questions variées et concrètes que se pose le grand public sur le thème « {th} ». Questions courtes, en français, une idée par question. Évite celles-ci : {json.dumps(deja, ensure_ascii=False)}. Réponds uniquement par un tableau JSON de chaînes."}], 1500))
                          for q in (r or []):
                              if isinstance(q, str) and 10 < len(q) < 160 and not proche(q) and q not in file: file.append(q.strip())
                          continue
                      lot = file[:5]; file = file[5:]
                      r = json_de(ia([{"role": "system", "content": SYS}, {"role": "user", "content": "Réponds à chacune de ces questions en 4 à 8 phrases (ou une courte liste à tirets), en français. "
                          "Réponds uniquement par un tableau JSON d’objets {\"q\": question, \"r\": réponse}, dans le même ordre.\n" + json.dumps(lot, ensure_ascii=False)}]))
                      for x in (r or []):
                          if not isinstance(x, dict) or not x.get("q") or not x.get("r") or len(x["r"]) < 80 or proche(x["q"]): continue
                          n = len(Q); Q.append([n, x["q"].strip()]); vus.append(jetons(x["q"])); nouveaux.append([n, x["q"].strip(), x["r"].strip(), datetime.date.today().isoformat()])
              except StopIteration: pass
              par = {}
              for n, q, r, d in nouveaux: par.setdefault(n // TAILLE, []).append([n, r, d])
              for k, L2 in par.items():
                  p = D / f"{k:04d}.json"; old = json.loads(p.read_text(encoding="utf-8")) if p.exists() else {"reponses": {}}
                  for n, r, d in L2: old["reponses"][str(n)] = [r, d]
                  p.write_text(json.dumps(old, ensure_ascii=False, separators=(",", ":")), encoding="utf-8")
              if not nouveaux and not Q: log("Aucune réponse rédigée.")
              I.update({"maj": datetime.datetime.utcnow().strftime("%Y-%m-%d %H:%M"), "modele": MODELE, "taille": TAILLE, "questions": Q, "theme": t, "source": "Réponses rédigées par intelligence artificielle (GitHub Models), à vérifier"})
              (D / "index.json").write_text(json.dumps(I, ensure_ascii=False, separators=(",", ":")), encoding="utf-8")
              log(f"{len(nouveaux)} nouvelles questions-réponses ({APPELS} appels à l’IA) ; {len(Q)} au total")
          try: principal()
          except Exception as e: log(f"✘ {type(e).__name__} {str(e)[:300]}")
          (L / "faq.txt").write_text(f"Dernier passage : {datetime.datetime.utcnow():%Y-%m-%d %H:%M} UTC\n" + "\n".join(J), encoding="utf-8")
          PYEOF
          python3 /tmp/faq.py
      - name: Enregistrer
        if: always()
        run: |
          git config user.name "robot-cotes-et-routes"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/faq data/logs
          if git diff --cached --quiet; then echo "Rien de nouveau"; exit 0; fi
          git commit -qm "Questions-réponses : nouvelles réponses"
          for essai in 1 2 3 4 5 6; do
            if git push; then exit 0; fi
            sleep 15
            git pull -q --rebase -X theirs origin main || git rebase --abort
          done
          exit 1
          
