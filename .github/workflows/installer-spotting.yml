          python3 - <<'PYEOF'
          import base64, gzip, json, pathlib
          d = json.loads(gzip.decompress(base64.b64decode(pathlib.Path("/tmp/paquet.b64").read_text().replace("\n", ""))))
          P = pathlib.Path
          P("spotting/index.html").write_text(d["spot"], encoding="utf-8")
          r = P("spotting/radar.js"); s = r.read_text(encoding="utf-8")
          if "window.SPOT=" not in s:
              for a, b in d["patches"]:
                  if s.count(a) != 1: raise SystemExit("radar.js : point de modification introuvable")
                  s = s.replace(a, b)
              r.write_text(s, encoding="utf-8")
          P("design").mkdir(exist_ok=True)
          P("design/site-v2.css").write_text(d["css"], encoding="utf-8")
          P("design/site-v2.js").write_text(d["js"], encoding="utf-8")
          h = P("index.html"); t = h.read_text(encoding="utf-8")
          if 'href="spotting/"' not in t and '<a href="#quiz">Quiz</a>' in t:
              t = t.replace('<a href="#quiz">Quiz</a>', '<a href="#quiz">Quiz</a>\n      <a href="spotting/">✈️ Spotting</a>', 1)
          if "design/site-v2.css" not in t:
              t = t.replace("</head>", '<link rel="stylesheet" href="design/site-v2.css">\n</head>', 1)
              t = t.replace("</body>", '<script src="design/site-v2.js" defer></script>\n</body>', 1)
          h.write_text(t, encoding="utf-8")
          print("Design v2 + Spotting v3 installés")
