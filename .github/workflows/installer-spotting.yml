name: Installation Spotting

on:
  push:
    paths:
      - ".github/workflows/installer-spotting.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Branchement du relais Cloudflare du radar
        run: |
          cat > /tmp/appli.py <<'PYEOF'
          import pathlib
          P = pathlib.Path
          URL = "https://radar-spotting.pablopacaut17.workers.dev"
          def rep(t, a, b, nom):
              if b in t: return t
              if t.count(a) != 1: raise SystemExit("motif introuvable : " + nom)
              return t.replace(a, b)
          r = P("spotting/radar.js"); t = r.read_text(encoding="utf-8")
          t = rep(t, 'e("cfg",{}))', 'e("cfg",{}),{robot:e("cfg",{}).robot||"' + URL + '"})', "relais")
          t = rep(t, '.then(function(e){return t("credit").innerHTML="Données : "+(e._source||', '.then(function(e){window.SPOT_DIAG=e._diag||[];return t("credit").innerHTML="Données : "+(e._source||', "diag")
          r.write_text(t, encoding="utf-8")
          h = P("spotting/index.html"); t = h.read_text(encoding="utf-8")
          t = t.replace('radar.js?v=5"', 'radar.js?v=6"')
          h.write_text(t, encoding="utf-8")
          print("Relais branché")
          PYEOF
          git config user.name "robot-cotes-et-routes"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for essai in 1 2 3 4 5 6; do
            git fetch origin main && git reset --hard origin/main
            python3 /tmp/appli.py
            git add -A spotting
            if git diff --cached --quiet; then echo "Déjà à jour"; exit 0; fi
            git commit -m "Radar : branché sur le relais Cloudflare"
            if git push; then echo "Installé"; exit 0; fi
            sleep 15
          done
          exit 1
          
