name: Installation Spotting

on:
  push:
    paths:
      - ".github/workflows/installer-spotting.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Nouvelle interface de la page Spotting
        run: |
          mkdir -p spotting
          cat > spotting/index.html <<'HTMLEOF'
          <!DOCTYPE html>
          <html lang="fr">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
          <title>Spotting &amp; Comprendre l’avion – Cotes &amp; Routes</title>
          <meta name="theme-color" content="#1B2A38">
          <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;700;800&family=Overpass+Mono:wght@600;700&display=swap" rel="stylesheet">
          <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
          <style>
          :root{--paper:#EEF2F4;--surface:#FFFFFF;--ink:#0E2235;--muted:#4C6075;--line:#C9D3DB;--board:#1B2A38;--board2:#243747;--sign:#FFC72C;--acc:#FFC72C;--rare:#C2187A;--ok:#2E7D4F;--soft:#F5F8FA;--fd:"Overpass","Arial Narrow",Arial,sans-serif;--fm:"Overpass Mono",ui-monospace,Menlo,monospace;--gris:var(--muted);--carte:var(--surface)}@media (prefers-color-scheme:dark){:root{--paper:#0B1621;--surface:#111F2C;--ink:#E3EAF0;--muted:#9AABBB;--line:#263A4C;--board:#060D14;--board2:#0F1C28;--rare:#E36BB7;--ok:#5BC48A;--soft:#0E1B27}}*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
          body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--fd);font-size:16px;line-height:1.5;font-variant-numeric:tabular-nums;padding-bottom:calc(70px + env(safe-area-inset-bottom,0px))}a{color:inherit}header{position:sticky;top:0;z-index:1000;background:var(--board);color:#fff;padding:env(safe-area-inset-top,0px) 0 0}.hb{display:flex;align-items:center;gap:10px;max-width:980px;margin:auto;padding:10px 14px}.brand{font-weight:800;font-size:1.05rem;text-decoration:none;color:#fff;white-space:nowrap}.brand span{opacity:.6;font-weight:600}
          .sign{background:var(--sign);color:#111;font-weight:800;letter-spacing:.08em;border-radius:4px;padding:2px 8px;font-size:.85rem}#etat{margin-left:auto;font:700 .78rem var(--fm);color:#B9C7D3;background:var(--board2);border-radius:20px;padding:4px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:48vw}#etat::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#7B8B99;margin-right:6px;vertical-align:1px}body.live #etat::before{background:#3DDC84;box-shadow:0 0 0 3px rgba(61,220,132,.25);animation:pulse 1.6s infinite}
          @keyframes pulse{50%{box-shadow:0 0 0 6px rgba(61,220,132,0)}}nav.onglets{position:fixed;left:0;right:0;bottom:0;z-index:1001;display:flex;background:var(--board);padding-bottom:env(safe-area-inset-bottom,0px);border-top:1px solid rgba(255,255,255,.08)}nav.onglets button{flex:1;background:none;border:0;color:#9FB0BF;font:600 .7rem var(--fd);padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}nav.onglets button::before{font-size:1.25rem;line-height:1.2}
          nav.onglets button[data-o=radar]::before{content:"📡"}nav.onglets button[data-o=carnet]::before{content:"📒"}nav.onglets button[data-o=liste]::before{content:"⭐"}nav.onglets button[data-o=comprendre]::before{content:"🎓"}nav.onglets button[data-o=reglages]::before{content:"⚙️"}nav.onglets button.actif{color:var(--sign)}nav.onglets button.actif::after{content:"";width:22px;height:3px;border-radius:2px;background:var(--sign);margin-top:2px}
          @media (min-width:760px){body{padding-bottom:0}nav.onglets{position:sticky;top:46px;bottom:auto;justify-content:center;gap:6px;border:0}nav.onglets button{flex:0 0 auto;flex-direction:row;font-size:.95rem;padding:10px 16px;gap:8px}nav.onglets button::before{font-size:1rem}nav.onglets button.actif::after{display:none}nav.onglets button.actif{background:var(--board2);border-radius:8px 8px 0 0}}main{max-width:980px;margin:auto}section{display:none;padding:14px}section.actif{display:block;animation:apparait .2s ease}@keyframes apparait{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
          h3{font-size:1.05rem;margin:1.2rem 0 .5rem}.panneau{background:var(--board);color:#fff;border-radius:14px;padding:14px;margin-bottom:12px}.panneau h2{margin:0 0 2px;font-size:1.15rem}.panneau p{margin:0 0 10px;color:#B9C7D3;font-size:.88rem}#demarrer{width:100%;font-size:1.05rem;padding:14px;background:var(--sign);color:#111;font-weight:800;border-radius:12px}body.live #demarrer{background:var(--board2);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}#carte{height:38vh;min-height:230px;border-radius:14px;margin-bottom:10px;border:1px solid var(--line);background:var(--soft)}
          .filtres{display:flex;gap:6px;margin:4px 0 6px;overflow-x:auto}.filtres button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:20px;padding:6px 12px;font:600 .85rem var(--fd);white-space:nowrap;cursor:pointer}.filtres button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}#avions.seulsInt .av:not(.int){display:none}.av{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:7px 0;display:flex;gap:10px;align-items:center}.av.int{border-left:5px solid var(--rare)}
          .av .t{flex:1;min-width:0;cursor:pointer}.av .t>b{font:700 1rem var(--fm);background:var(--board);color:var(--sign);border-radius:4px;padding:1px 6px;margin-right:6px}.av small{display:block;color:var(--muted);font-size:.8rem;margin-top:3px}.tag{display:inline-block;background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin:5px 4px 0 0;font-size:.74rem;font-weight:600}.tag.r{background:var(--rare);border-color:var(--rare);color:#fff}
          button.vu{background:var(--sign);color:#111;border:0;border-radius:10px;padding:9px 11px;font:800 .85rem var(--fd);cursor:pointer;flex:0 0 auto}button.vu.fait{background:var(--ok);color:#fff}.btn{background:var(--board);color:#fff;border:0;border-radius:10px;padding:10px 14px;font:700 .92rem var(--fd);margin:.25rem 0;cursor:pointer}label{display:block;margin:.8rem 0 .25rem;color:var(--muted);font-size:.86rem;font-weight:600}input,textarea,select{width:100%;padding:.6rem .7rem;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:1rem var(--fd)}
          textarea{min-height:6rem}.note{color:var(--muted);font-size:.8rem;line-height:1.4}.vide{color:var(--muted);text-align:center;padding:1.4rem .5rem;background:var(--surface);border:1px dashed var(--line);border-radius:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stats div{background:var(--board);color:#B9C7D3;border-radius:12px;padding:12px 6px;text-align:center;font-size:.8rem;font-weight:600}.stats b{display:block;font:700 1.6rem var(--fm);color:var(--sign)}
          .badges span{display:inline-block;margin:4px;padding:6px 10px;border-radius:20px;background:var(--surface);border:1px solid var(--line);font-size:.82rem;font-weight:600;color:var(--muted)}.badges span.ok{background:var(--sign);border-color:var(--sign);color:#111}#fiche{display:none;position:fixed;inset:0;background:rgba(6,13,20,.6);z-index:2000;overflow:auto;padding:12vh 0 0}.fbox{background:var(--surface);border-radius:18px 18px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px));max-width:680px;margin:auto;min-height:88vh}
          .fbox h3{margin:.1rem 0 .5rem;font:700 1.4rem var(--fm)}.fbox table{width:100%;border-collapse:collapse;margin:.6rem 0;font-size:.92rem}.fbox td{padding:.45rem .2rem;border-bottom:1px solid var(--line);vertical-align:top}.fbox td:first-child{color:var(--muted);width:42%}.fbox h4{margin:1rem 0 .4rem}#ffermer{background:var(--soft);color:var(--ink);border:1px solid var(--line)}#fhisto div{padding:.35rem 0;border-bottom:1px solid var(--line);font-size:.86rem}a.lien{color:var(--rare);font-weight:700}.cbarre{display:flex;gap:6px;align-items:center}.cbarre input{flex:1}.cbarre .btn{margin:0}
          #cbtnQuiz{background:var(--sign)!important;color:#111!important}.chap{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin:.6rem 0;overflow:hidden}.chap>h2{margin:0;padding:.85rem 1rem;font-size:1rem;cursor:pointer;display:flex;justify-content:space-between;gap:.5rem}.chap>h2 small{color:var(--muted);font:700 .8rem var(--fm)}.chap .corps{display:none;padding:0 1rem .6rem}.chap.ouvert .corps{display:block}.chap.ouvert>h2{background:var(--board);color:#fff}.chap.ouvert>h2 small{color:var(--sign)}.fiche{border-top:1px solid var(--line);padding:.75rem 0}
          .fiche h3{margin:0 0 .25rem;font-size:.98rem;display:flex;justify-content:space-between;gap:.5rem}.fiche p{margin:.2rem 0;line-height:1.55}.chiffre{display:inline-block;background:var(--sign);color:#111;font:700 .8rem var(--fm);border-radius:6px;padding:.05rem .5rem;margin-top:.25rem}.lu{font-size:.75rem;color:var(--muted);cursor:pointer;white-space:nowrap}.lu.ok{color:var(--ok);font-weight:700}mark{background:var(--sign);color:#111;border-radius:3px}#cquiz{display:none;background:var(--board);color:#fff;border-radius:14px;padding:1rem;margin:.7rem 0}
          #cquiz .rep{display:block;width:100%;text-align:left;margin:.45rem 0;background:var(--board2);color:#fff;border:0;border-radius:10px;padding:.7rem;font:600 .95rem var(--fd)}#cquiz .rep.bon{background:#2E7D4F}#cquiz .rep.faux{background:#B3261E}#cquiz button:not(.rep){background:var(--sign);color:#111;border:0;border-radius:10px;padding:.6rem .9rem;font:700 .9rem var(--fd);margin-top:.4rem}.leaflet-container{font-family:var(--fd)}
          </style>
          </head>
          <body>
          <header><div class="hb">
            <a class="brand" href="../">✈ Cotes &amp; Routes <span>›</span></a>
            <span class="sign">SPOTTING</span>
            <span id="etat">arrêté</span>
          </div></header>
          <nav class="onglets">
            <button data-o="radar" class="actif">Radar</button>
            <button data-o="carnet">Carnet</button>
            <button data-o="liste">Ma liste</button>
            <button data-o="comprendre">Comprendre</button>
            <button data-o="reglages">Réglages</button>
          </nav>
          <main>
          <section id="radar" class="actif">
            <div class="panneau">
              <h2>Le ciel autour de toi</h2>
              <p>Avions en direct, croisés avec la base Cotes &amp; Routes. Touche un avion pour sa fiche complète.</p>
              <button id="demarrer" class="btn">▶ Démarrer le radar autour de moi</button>
            </div>
            <div id="carte"></div>
            <div class="filtres"><button class="on" data-f="tous">Tous les avions</button><button data-f="int">Seulement les intéressants</button></div>
            <div id="avions"><p class="vide">Démarre le radar pour voir les avions autour de toi.</p></div>
            <p class="note" id="base"></p>
            <p class="note" id="credit"></p>
          </section>

          <section id="carnet">
            <div class="stats">
              <div><b id="sVus">0</b>avions vus</div>
              <div><b id="sTypes">0</b>types</div>
              <div><b id="sCies">0</b>compagnies</div>
            </div>
            <p class="note" id="sCompte"></p>
            <h3>Badges</h3>
            <div class="badges" id="badges"></div>
            <h3>Derniers avions vus</h3>
            <div id="vus"></div>
            <button class="btn" id="export">⬇ Exporter mon carnet</button>
            <label>Importer un carnet (fichier .json)</label>
            <input type="file" id="import" accept=".json,application/json">
          </section>

          <section id="liste">
            <label>Mes avions à voir : un type ICAO (ex. A388, B748) ou une immatriculation (ex. F-HPJA) par ligne</label>
            <textarea id="maListe"></textarea>
            <label>Mes livrées spéciales : « IMMAT = description », une par ligne</label>
            <textarea id="mesLivrees" placeholder="F-XXXX = Livrée rétro"></textarea>
            <button class="btn" id="sauverListe">Enregistrer</button>
            <p class="note">Un avion de ta liste déclenche toujours une alerte quand il entre dans ton rayon.</p>
          </section>

          <section id="comprendre">
            <div class="cbarre">
              <input id="cq" type="search" placeholder="Chercher : portance, turbine, ILS…">
              <button class="btn" id="chasard" title="Fiche au hasard">🎲</button>
              <button class="btn" id="cbtnQuiz">Quiz</button>
            </div>
            <p class="note" id="cprogres"></p>
            <div id="cquiz"></div>
            <div id="cliste"></div>
            <p class="note">Fiches de vulgarisation : les valeurs sont des ordres de grandeur typiques ; les documents constructeurs font foi.</p>
          </section>

          <section id="reglages">
            <label>Rayon surveillé (km)</label><input id="rayon" type="number" min="10" max="460" step="10">
            <label>Distance de passage qui déclenche « passe au-dessus de moi » (km)</label><input id="seuil" type="number" min="1" max="100">
            <label>Horizon d’anticipation (minutes)</label><input id="horizon" type="number" min="1" max="60">
            <label><input id="toutProche" type="checkbox" style="width:auto"> Alerter aussi pour TOUT avion qui passe sous ce seuil</label>
            <label>Rafraîchissement (secondes, minimum 10)</label><input id="periode" type="number" min="10" max="120">
            <h3>Alertes téléphone en poche (robot)</h3>
            <label>Adresse de ton robot Cloudflare</label><input id="robot" type="url" placeholder="laisser vide si pas encore installé">
            <label>Mot de passe du robot</label><input id="robotCle" type="password">
            <label>Sujet ntfy (nom secret)</label><input id="ntfy">
            <button class="btn" id="sauverReglages">Enregistrer</button>
            <button class="btn" id="testNotif">🔔 Tester une notification</button>
            <p class="note">Le robot reçoit ta dernière position quand cette page est ouverte, puis surveille le ciel autour de ce point toutes les 3 minutes et t’envoie une notification via l’appli ntfy, même téléphone verrouillé.</p>
          </section>
          </main>
          <div id="fiche"></div>
          <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
          <script src="donnees.js"></script>
          <script src="moteur.js"></script>
          <script src="radar.js"></script>
          <script src="fiches1.js"></script>
          <script src="fiches2.js"></script>
          <script src="fiches3.js"></script>
          <script src="fiches4.js"></script>
          <script src="fiches5.js"></script>
          <script src="comprendre.js"></script>
          <script>
          (function(){
            var av=document.getElementById('avions');
            document.querySelectorAll('.filtres button').forEach(function(b){b.onclick=function(){
              document.querySelectorAll('.filtres button').forEach(function(x){x.classList.toggle('on',x===b);});
              av.classList.toggle('seulsInt',b.dataset.f==='int');};});
            var d=document.getElementById('demarrer');
            new MutationObserver(function(){document.body.classList.toggle('live',/Arrêter/.test(d.textContent));}).observe(d,{childList:true,characterData:true,subtree:true});
            document.querySelectorAll('nav.onglets button').forEach(function(b){b.addEventListener('click',function(){window.scrollTo(0,0);});});
          })();
          </script>
          </body>
          </html>

          HTMLEOF
          rm -f spotting/LISEZMOI.txt
          rm -rf spotting/.github
      - name: Lien Spotting dans le menu et sur l'accueil du site
        run: |
          python3 - <<'PYEOF'
          import pathlib
          p = pathlib.Path("index.html"); h = p.read_text(encoding="utf-8")
          if 'href="spotting/"' in h:
              print("Liens deja presents")
          else:
              nav = '<a href="#quiz">Quiz</a>'
              carte = '<a href="#quiz"><strong>Quiz</strong>'
              if nav in h:
                  h = h.replace(nav, nav + '\n      <a href="spotting/">✈️ Spotting</a>', 1)
              else:
                  print("ATTENTION : menu introuvable")
              i = h.find(carte)
              if i >= 0:
                  j = h.find('</a>', i) + 4
                  h = h[:j] + '\n    <a href="spotting/"><strong>✈️ Spotting en direct</strong><span>Le radar des avions autour de toi, relié à la base Cotes &amp; Routes : fiches, historique, carnet, alertes, et 188 fiches pour comprendre l’avion.</span></a>' + h[j:]
              else:
                  print("ATTENTION : carte d'accueil introuvable")
              p.write_text(h, encoding="utf-8")
              print("Liens ajoutes")
          PYEOF
      - name: Enregistrer
        run: |
          git config user.name "robot-cotes-et-routes"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A spotting index.html
          git diff --cached --quiet || git commit -m "Spotting : nouvelle interface et lien dans le menu"
          git push || (git pull --rebase && git push)
          
