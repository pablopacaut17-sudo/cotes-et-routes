          python3 - <<'PYEOF'
          import base64, gzip, json, pathlib
          d = json.loads(gzip.decompress(base64.b64decode(pathlib.Path("/tmp/paquet.b64").read_text().replace("\n", ""))))
          P = pathlib.Path
          P("design").mkdir(exist_ok=True)
          P("design/site-v3.css").write_text(d["css"], encoding="utf-8")
          P("design/site-v3.js").write_text(d["js"], encoding="utf-8")
          ns = {}; exec(d["inj"], ns)
          h = P("index.html"); t = h.read_text(encoding="utf-8")
          if "design/site-v2.css" not in t:
              raise SystemExit("design v2 absent : installer d'abord la version precedente")
          h.write_text(ns["injecter"](t), encoding="utf-8")
          s = P("spotting/index.html"); u = s.read_text(encoding="utf-8")
          if "photo du type" not in u:
              s.write_text(u.replace("</body>", d["spot"] + "\n</body>", 1), encoding="utf-8")
          print("Design v3 installé")
