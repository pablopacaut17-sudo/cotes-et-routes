          cat > /tmp/appli.py <<'PYEOF'
          import base64, lzma, json, pathlib
          d = json.loads(lzma.decompress(base64.b64decode(pathlib.Path("/tmp/paquet.b64").read_text().replace("\n", ""))))
          P = pathlib.Path
          for k, v in d["f"].items():
              P(k).parent.mkdir(parents=True, exist_ok=True); P(k).write_text(v, encoding="utf-8")
          for k, v in d.get("b", {}).items():
              P(k).parent.mkdir(parents=True, exist_ok=True); P(k).write_bytes(base64.b64decode(v))
          h = P("index.html"); t = h.read_text(encoding="utf-8")
          if d.get("inj"):
              ns = {}; exec(d["inj"], ns); t = ns["injecter"](t)
          for a, b in d.get("rep", []):
              if b not in t: t = t.replace(a, b)
          h.write_text(t, encoding="utf-8")
          if d.get("ico"):
              import os; exec(d["ico"], {})
          if d.get("spot"):
              s = P("spotting/index.html"); u = s.read_text(encoding="utf-8")
              if d["spot"] not in u: u = u.replace("</body>", d["spot"] + "\n</body>", 1); s.write_text(u, encoding="utf-8")
          print("OK")

          PYEOF
          git config user.name "robot-cotes-et-routes"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for essai in 1 2 3 4 5 6; do
            git fetch origin main && git reset --hard origin/main
            python3 /tmp/appli.py
            git add -A .
            if git diff --cached --quiet; then echo "Deja a jour"; exit 0; fi
            git commit -m "Image affichee quand on partage un lien du site"
            if git push; then echo "Installe"; exit 0; fi
            sleep 15
          done
          exit 1
          
