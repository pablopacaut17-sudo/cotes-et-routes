          h = P("index.html"); t = h.read_text(encoding="utf-8")
          if d.get("inj"):
              ns = {}; exec(d["inj"], ns); t = ns["injecter"](t)
          for a, b in d.get("rep", []):
              if b not in t: t = t.replace(a, b)
          h.write_text(t, encoding="utf-8")
