name: "Gardien de la taille du site (1 Go)"

on:
  schedule:
    - cron: "23 5 * * 0"
  push:
    paths:
      - ".github/workflows/gardien.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gardien
  cancel-in-progress: false

jobs:
  gardien:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Vérifier la taille
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET: ${{ vars.HF_DATASET }}
        run: |
          pip install -q huggingface_hub
          cat > /tmp/gardien.py <<'PYEOF'
          """Cotes & Routes : gardien de la taille du site.
          Tant que le site publié pèse moins de 900 Mo, il ne fait rien.
          Au-delà, il dépose d’abord toutes les données sur Hugging Face, puis retire du site les archives les plus anciennes
          (uniquement celles dont une copie identique existe sur Hugging Face), jusqu’à redescendre à 800 Mo."""
          import os, sys, json, pathlib, datetime, re
          SEUIL, CIBLE = 900 * 2**20, 800 * 2**20
          RACINE = pathlib.Path(".")
          JOURNAL = []
          def log(*a):
              m = " ".join(str(x) for x in a); print(m, flush=True); JOURNAL.append(m)
          def taille():
              t = 0
              for p in RACINE.rglob("*"):
                  if p.is_file() and ".git" not in p.parts: t += p.stat().st_size
              return t
          def fin():
              pathlib.Path("data/logs").mkdir(parents=True, exist_ok=True)
              pathlib.Path("data/logs/gardien.txt").write_text(f"Dernier passage : {datetime.datetime.utcnow():%Y-%m-%d %H:%M} UTC\n" + "\n".join(JOURNAL), encoding="utf-8")
          def main():
              t = taille(); log(f"Taille du site publié : {t / 2**20:.0f} Mo (limite GitHub Pages : 1 024 Mo, seuil d’action : {SEUIL // 2**20} Mo)")
              if t < SEUIL:
                  log("Rien à faire : le site est sous le seuil."); return
              tok = os.environ.get("HF_TOKEN")
              if not tok:
                  log("⚠️ Seuil dépassé mais le secret HF_TOKEN est absent : aucune suppression, par sécurité."); return
              from huggingface_hub import HfApi
              api = HfApi(token=tok); repo = os.environ.get("HF_DATASET") or f"{api.whoami()['name']}/cotes-et-routes-archive"
              api.create_repo(repo_id=repo, repo_type="dataset", private=False, exist_ok=True)
              log("Dépôt complet des données sur Hugging Face :", repo)
              api.upload_folder(folder_path="data", path_in_repo="data", repo_id=repo, repo_type="dataset", ignore_patterns=["logs/**"], commit_message=f"Archive complète avant allègement du {datetime.date.today().isoformat()}")
              distants = {}
              for f in api.list_repo_tree(repo_id=repo, repo_type="dataset", path_in_repo="data", recursive=True):
                  if getattr(f, "size", None) is not None: distants[f.path] = f.size
              log(f"{len(distants)} fichiers présents sur Hugging Face")
              def date(p):
                  m = re.search(r"(20\d\d)-?(\d\d)-?(\d\d)?", p.name)
                  return (m.group(1) + m.group(2) + (m.group(3) or "00")) if m else "99999999"
              cand = [p for d in ("data/flights", "data/news", "data/history", "data/semaine") if pathlib.Path(d).exists() for p in pathlib.Path(d).rglob("*") if p.is_file() and date(p) != "99999999"]
              cand.sort(key=date)
              retires = []
              for p in cand:
                  if t <= CIBLE: break
                  cle = p.as_posix()
                  if distants.get(cle) != p.stat().st_size: continue
                  t -= p.stat().st_size; retires.append(cle); p.unlink()
              log(f"{len(retires)} fichiers anciens retirés du site (copies conservées sur Hugging Face), nouvelle taille : {t / 2**20:.0f} Mo")
              cfg = pathlib.Path("data/archive-config.json")
              try: c = json.loads(cfg.read_text(encoding="utf-8"))
              except Exception: c = {}
              c.setdefault("retires_du_site", []); c["retires_du_site"] = sorted(set(c["retires_du_site"] + retires))
              c["archive_hugging_face"] = f"https://huggingface.co/datasets/{repo}/resolve/main/"
              cfg.write_text(json.dumps(c, ensure_ascii=False, indent=1), encoding="utf-8")
              if t > SEUIL: log("⚠️ Encore au-dessus du seuil après allègement : d’autres types de fichiers grossissent, à examiner.")
          try: main()
          except Exception as e: log(f"✘ Erreur : {type(e).__name__} {str(e)[:300]}")
          fin()
          PYEOF
          python /tmp/gardien.py
      - name: Enregistrer
        if: always()
        run: |
          git config user.name "robot-cotes-et-routes"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then echo "Rien de nouveau"; exit 0; fi
          git commit -qm "Gardien de la taille du site"
          for essai in 1 2 3 4 5 6; do
            if git push; then exit 0; fi
            sleep 15
            git pull -q --rebase -X theirs origin main || git rebase --abort
          done
          exit 1
          
