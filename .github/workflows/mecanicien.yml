name: "Robot mécanicien (entretien des robots)"

on:
  schedule:
    - cron: "23 5 * * *"
  push:
    paths:
      - ".github/workflows/mecanicien.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: mecanicien
  cancel-in-progress: false

jobs:
  mecanicien:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.MECANICIEN_TOKEN || github.token }}
      - name: Entretenir les robots
        env:
          MT: ${{ secrets.MECANICIEN_TOKEN }}
          GH_TOKEN: ${{ github.token }}
