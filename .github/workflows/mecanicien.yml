          B64EOF
          cat > /tmp/mecanicien.py <<'PYEOF'
          """Cotes & Routes : robot mécanicien. Entretient les robots eux-mêmes (avec le secret MECANICIEN_TOKEN) :
          blindage (une donnée bizarre ne fait plus planter un robot), contrôle avant enregistrement, briques GitHub à jour,
          miroir de secours. Si un robot entretenu échoue ensuite alors qu'il marchait avant, sa version d'origine est remise."""
          import os, re, json, ast, base64, lzma, subprocess, pathlib, datetime, hashlib
          import yaml
          W = pathlib.Path(".github/workflows"); G = pathlib.Path(".github"); ORI = G / "originaux"; L = pathlib.Path("data/logs"); L.mkdir(parents=True, exist_ok=True)
          J = []
          def log(m): print(m, flush=True); J.append(m)
          def sh(*a): return subprocess.run(list(a), capture_output=True, text=True).stdout
          MAINT = datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ")
          PAQUET = json.loads(lzma.decompress(base64.b64decode(pathlib.Path("/tmp/paquet.b64").read_text().replace("\n", ""))))
          EXCLUS_BL = {"installer-spotting.yml", "medecin.yml", "testeur.yml", "gardien.yml", "menage.yml", "sauvegarde.yml", "liens.yml", "bilan.yml", "qualite.yml", "archive.yml", "compteur.yml", "mecanicien.yml", "miroir.yml"}
          EXCLUS_GARDE = {"installer-spotting.yml", "menage.yml", "mecanicien.yml", "testeur.yml", "sauvegarde.yml", "miroir.yml", "gardien.yml"}
          VERSIONS = [("actions/checkout@v4", "actions/checkout@v5"), ("actions/setup-python@v5", "actions/setup-python@v6")]
          GARDE = '[ -f "$GITHUB_WORKSPACE/.github/garde.py" ] && python3 "$GITHUB_WORKSPACE/.github/garde.py" || true'
          EF = G / "mecanicien.json"; ETAT = json.loads(EF.read_text(encoding="utf-8")) if EF.exists() else {}
          ETAT.setdefault("transformes", {}); ETAT.setdefault("exclus", [])
          EXC = '''try:
              pass
          except Exception as _e_:
              print(f"⚠️ élément ignoré : {type(_e_).__name__} {str(_e_)[:150]}", flush=True)
          '''
          class B(ast.NodeTransformer):
              def __init__(s): s.n = 0; s.prot = 0
              def visit_Try(s, node):
                  s.prot += 1; node.body = [s.visit(x) for x in node.body]; s.prot -= 1
                  node.handlers = [s.visit(h) for h in node.handlers]; node.orelse = [s.visit(x) for x in node.orelse]; node.finalbody = [s.visit(x) for x in node.finalbody]
                  return node
              def visit_FunctionDef(s, node):
                  p = s.prot; s.prot = 0; s.generic_visit(node); s.prot = p; return node
              visit_AsyncFunctionDef = visit_FunctionDef
              def visit_For(s, node):
                  bad = any(isinstance(x, (ast.Return, ast.Raise, ast.Yield, ast.YieldFrom, ast.Global, ast.Nonlocal)) for x in ast.walk(node))
                  if s.prot or bad or node.orelse or (len(node.body) == 1 and isinstance(node.body[0], ast.Try)):
                      s.generic_visit(node); return node
                  t = ast.parse(EXC).body[0]; t.body = node.body; node.body = [t]; s.n += 1
                  s.prot += 1; t.body = [s.visit(x) for x in t.body]; s.prot -= 1
                  return node
          RX = re.compile(r"(?P<pre>^(?P<ind>[ \t]*)cat > (?P<f>\S+\.py) <<'PYEOF'\n)(?P<code>.*?)(?P<post>^[ \t]*PYEOF\n)", re.S | re.M)
          def codes(txt):
              for m in RX.finditer(txt):
                  ind = m.group("ind"); yield "\n".join(l[len(ind):] if l.startswith(ind) else l.lstrip() for l in m.group("code").split("\n"))
          def blinder(txt):
              total = 0
              def rep(m):
                  nonlocal total
                  ind = m.group("ind"); code = "\n".join(l[len(ind):] if l.startswith(ind) else l.lstrip() for l in m.group("code").split("\n"))
                  b = B(); arbre = ast.fix_missing_locations(b.visit(ast.parse(code)))
                  if not b.n: return m.group(0)
                  total += b.n; neuf = ast.unparse(arbre)
                  return m.group("pre") + "\n".join((ind + l) if l.strip() else "" for l in neuf.split("\n")) + "\n" + m.group("post")
              return RX.sub(rep, txt), total
          def garder(txt):
              return re.sub(r"^([ \t]*)(git add )", lambda m: m.group(1) + GARDE + "\n" + m.group(1) + m.group(2), txt, flags=re.M)
          def valide(txt):
              yaml.safe_load(txt)
              for c in codes(txt): compile(c, "robot", "exec")
          def principal():
              if not os.environ.get("MT"):
                  log("Secret MECANICIEN_TOKEN absent : le mécanicien ne peut pas entretenir les robots (rien n’a été modifié)."); return
              gp = G / "garde.py"
              if not gp.exists() or gp.read_text(encoding="utf-8") != PAQUET["garde"]: gp.write_text(PAQUET["garde"], encoding="utf-8"); log("Contrôle avant enregistrement installé (.github/garde.py)")
              if not (W / "miroir.yml").exists(): (W / "miroir.yml").write_text(PAQUET["miroir"], encoding="utf-8"); log("Robot « Miroir de secours » installé")
              for f, c in PAQUET.get("remplacer", {}).items():
                  h = hashlib.sha1(c.encode()).hexdigest()
                  if h in ETAT.setdefault("remplaces", []): continue
                  valide(c); (W / f).write_text(c, encoding="utf-8"); ETAT["remplaces"].append(h)
                  if f in ETAT["exclus"]: ETAT["exclus"].remove(f)
                  log(f"🆕 « {f} » remplacé par sa nouvelle version")
              try: noms = {pathlib.Path(w["path"]).name: w["name"] for w in json.loads(sh("gh", "workflow", "list", "--all", "--json", "name,path") or "[]")}
              except Exception: noms = {}
              ETAT["transformes"].pop("mecanicien.yml", None)
              for f, info in list(ETAT["transformes"].items()):
                  try: runs = json.loads(sh("gh", "run", "list", "--workflow", f, "-L", "20", "--json", "conclusion,createdAt,status") or "[]")
                  except Exception: continue
                  fin = [r for r in runs if r["status"] == "completed" and r["conclusion"] in ("success", "failure")]
                  apres = [r for r in fin if r["createdAt"] > info["date"]]; avant = [r for r in fin if r["createdAt"] <= info["date"]]
                  if len(apres) >= 2 and all(r["conclusion"] == "failure" for r in apres[:2]) and avant and avant[0]["conclusion"] == "success" and (ORI / f).exists():
                      (W / f).write_text((ORI / f).read_text(encoding="utf-8"), encoding="utf-8"); ETAT["exclus"].append(f); del ETAT["transformes"][f]
                      log(f"↩️ « {noms.get(f, f)} » échoue depuis son entretien alors qu’il marchait avant : version d’origine remise, il ne sera plus modifié")
              for p in sorted(W.glob("*.yml")):
                  f = p.name
                  if f in ETAT["exclus"] or f == "mecanicien.yml": continue
                  t = p.read_text(encoding="utf-8"); n = t; k = 0
                  for a, b in VERSIONS: n = n.replace(a, b)
                  try:
                      if f not in EXCLUS_BL and "élément ignoré" not in n: n, k = blinder(n)
                      if f not in EXCLUS_GARDE and "garde.py" not in n: n = garder(n)
                      if n == t: continue
                      valide(n)
                  except Exception as e: log(f"⚠️ {f} : entretien impossible ({type(e).__name__} {str(e)[:150]}), robot laissé tel quel"); continue
                  if "élément ignoré" not in t and "garde.py" not in t:
                      ORI.mkdir(parents=True, exist_ok=True); (ORI / f).write_text(t, encoding="utf-8")
                  p.write_text(n, encoding="utf-8"); ETAT["transformes"][f] = {"date": MAINT}; EF.write_text(json.dumps(ETAT, ensure_ascii=False, indent=1), encoding="utf-8")
                  log(f"🔧 « {noms.get(f, f)} » entretenu" + (f" ({k} boucle(s) blindée(s))" if k else ""))
              EF.write_text(json.dumps(ETAT, ensure_ascii=False, indent=1), encoding="utf-8")
          try: principal()
          except Exception as e: log(f"✘ {type(e).__name__} {str(e)[:300]}")
          if not any(m.startswith(("🆕", "🔧", "↩️", "⚠️", "✘", "Secret", "Contrôle", "Robot")) for m in J): log("Tout est à jour, rien à faire.")
          (L / "mecanicien.txt").write_text(f"Dernier passage : {datetime.datetime.utcnow():%Y-%m-%d %H:%M} UTC\n" + "\n".join(J), encoding="utf-8")
          PYEOF
          python3 /tmp/mecanicien.py
      - name: Enregistrer
        if: always()
        run: |
          git config user.name "robot-cotes-et-routes"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github data/logs
          if git diff --cached --quiet; then echo "Rien de nouveau"; exit 0; fi
          git commit -qm "Robot mécanicien : entretien des robots [skip ci]"
          for essai in 1 2 3 4 5 6; do
            if git push; then exit 0; fi
            sleep 15
            git pull -q --rebase -X theirs origin main || git rebase --abort
          done
          exit 1
          
