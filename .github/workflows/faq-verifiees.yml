name: "Questions-réponses vérifiées"

on:
  push:
    paths:
      - ".github/workflows/faq-verifiees.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verifiees:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Enregistrer les questions-réponses de Claude
        run: |
          cat > /tmp/verif.b64 <<'B64EOF'
          /Td6WFoAAATm1rRGAgAhARYAAAB0L+Wj4AV4AwtdAD2Iicc0ReDkRWvbQgm7CIQt+FIZwb+t06C8M1MkFgWiA7galV/qjNDnnR7S
          mAZwhimae01bSQPTLtFpPRq0k4241Tv15c+asHmyBoZATtcfLYNEA1HSJa4WviZ7+edIQWohqMGvFu6of+W9+vBf5PzhoAaXm6Cc
          /HvCJVbje/OcyfwoGZl3gA3sz5V55ZrAoajWoD3S1zlDDHwPuxQauxjTalJHTDT4WQ5j6EqtY9GJ0A3JpZAsqDCoJZxm/vFi54Sk
          m0xWeUCeQ5+4nXtK55cAtsYk6oxDxNzJ/Ibqyj6A1vYtp2nhUiDTib+3zPvrSDQinedG3l3WqEXxCjNTiTPUa12BL8WhaAnHyNKg
          HD30DyenKs/CMLf2H/VewIh2hFNMUH2RZf090MJhzuNcqD8lBxm50wL+0gyJwzoG52JWJ0Da+G6K22tyxRoufEqmTD4mqBGbP9yd
          pHA0mZitnQMD9G30eNfUdNnvjpxmoaly78yxedHH5ofseu323bhvyZwdDIdn4oX8A2xOJdHRM7PWwq03RNCYsBJli+Q3Ss2hUpn8
          n+0806yLPscP01cPi5oP8tVuXje5Y290IAN9YbO7J+4AEyPl7DigSQYcsTptTdB9Nv6uMATjZfHZ7Fv+iZ5gPzjpqvIWEG0pICJP
          Fc+yei0s0WNE3op4ck81NWhxUk76ePS4nipc7/W5JYGuoDi/JhFbxgSyApFZMkjtOphB26S+4tQgF5Y2xM9OkgYpb9c54rUCAZ9N
