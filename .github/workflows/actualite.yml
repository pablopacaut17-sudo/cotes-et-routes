name: Actualité

on:
  schedule:
    - cron: "17 * * * *"
  push:
    paths:
      - ".github/workflows/actualite.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualite
  cancel-in-progress: false

jobs:
  actualite:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Relever les titres et les enregistrer
        run: |
          cat > /tmp/actu.py <<'PYEOF'
          """Cotes & Routes : actualité aéronautique automatique, relevée toutes les heures.
          Deux sortes de sources : les flux RSS des sites spécialisés, et des recherches Google Actualités qui couvrent toute la presse
          francophone (nationale, régionale, tourisme, économie). On ne conserve que titre, lien, date et nom du journal (jamais le texte).
          Archive permanente : un fichier par mois (data/news/AAAA-MM.json) et un index (data/news/index.json). Rien n'est supprimé.
          Pas d'aviation militaire ni de drones (titres filtrés). Un flux indisponible est ignoré et noté dans data/logs/actualite.txt."""
          import json, re, sys, datetime, pathlib, urllib.request, urllib.parse, email.utils, html, unicodedata, time
          import xml.etree.ElementTree as ET
          FEEDS = [('Air Journal', 'https://www.air-journal.fr/feed'), ('Aerobuzz', 'https://www.aerobuzz.fr/feed/'),
                   ('Journal de l’Aviation', 'https://www.journal-aviation.com/rss'), ('AeroWeb-fr', 'https://www.aeroweb-fr.net/rss'),
                   ('Air & Cosmos', 'https://air-cosmos.com/rss'), ('TourMaG', 'https://www.tourmag.com/xml/syndication.rss'),
                   ('DéplacementsPros', 'https://www.deplacementspros.com/xml/syndication.rss'), ('L’Écho touristique', 'https://www.lechotouristique.com/feed'),
                   ('Aerovfr', 'https://www.aerovfr.com/feed/'), ('Aérocontact', 'https://www.aerocontact.com/rss/actualites'),
                   ('Simple Flying', 'https://simpleflying.com/feed/'), ('AeroTime', 'https://www.aerotime.aero/feed'),
                   ('Aviation Week', 'https://aviationweek.com/rss.xml'), ('AIN', 'https://www.ainonline.com/rss.xml'),
                   ('Airways Magazine', 'https://airwaysmag.com/feed'), ('AirlineGeeks', 'https://airlinegeeks.com/feed/'),
                   ('One Mile at a Time', 'https://onemileatatime.com/feed/'), ('Leeham News', 'https://leehamnews.com/feed/'),
                   ('Runway Girl', 'https://runwaygirlnetwork.com/feed/'), ('Flying Magazine', 'https://www.flyingmag.com/feed/'),
                   ('AVweb', 'https://avweb.com/feed/'), ('Flightradar24', 'https://www.flightradar24.com/blog/feed/'),
                   ('Aviation Safety Network', 'https://aviation-safety.net/news/rss.php'), ('The Aviation Herald', 'https://avherald.com/h?subscribe=rss')]
          RECHERCHES = ['aéroport', '"compagnie aérienne"', '"ligne aérienne" OR "nouvelle ligne" avion OR vols', '"transport aérien"',
                        'Airbus -défense', 'Boeing', '"Air France" OR Transavia OR KLM', 'easyJet OR Ryanair OR Volotea OR Vueling OR Corsair',
                        '"aviation civile" OR DGAC OR EASA OR AESA', '"trafic aérien" OR "contrôle aérien" OR "contrôleurs aériens"',
                        'aéronautique -militaire', 'aérodrome OR aéroclub OR ULM OR planeur OR montgolfière', 'hélicoptère -militaire -armée',
                        'accident avion', 'atterrissage urgence avion', 'pilote de ligne OR hôtesse OR steward OR "personnel navigant"',
                        'avion passagers', 'Safran OR Dassault Aviation OR ATR OR Embraer', 'kérosène OR "carburant durable" avion']
          EXCLU = re.compile(r"\b(drones?|militaires?|arm[ée]e de l.air|chasseurs?|avions? rafale|rafale marine|f-35|f-16|f-22|eurofighter|gripen|a400m|missiles?|bombardements?|frappes? a[ée]riennes?|d[ée]fense a[ée]rienne|military|fighter jets?|air force|warplanes?)\b", re.I)
          # adresses de secours essayées si l'adresse principale d'un flux ne marche pas
          AUTRES = {'Air & Cosmos': ['https://www.air-cosmos.com/rss', 'https://air-cosmos.com/feed'],
                    'AIN': ['https://www.ainonline.com/feed', 'https://www.ainonline.com/news/rss.xml'],
                    'Airways Magazine': ['https://www.airwaysmag.com/feed', 'https://airwaysmag.com/feed/'],
                    'Aérocontact': ['https://www.aerocontact.com/rss'], 'AeroWeb-fr': ['https://www.aeroweb-fr.net/rss/actualites']}
          NAV = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0 Safari/537.36'
          NDIR = pathlib.Path('data') / 'news'
          LOG = pathlib.Path('data') / 'logs' / 'actualite.txt'

          def parse_date(s):
              if not s:
                  return None
              try:
                  return email.utils.parsedate_to_datetime(s).astimezone(datetime.timezone.utc)
              except Exception:
                  pass
              try:
                  return datetime.datetime.fromisoformat(s.strip().replace('Z', '+00:00')).astimezone(datetime.timezone.utc)
              except Exception:
                  return None

          def clean(t):
              return re.sub('\\s+', ' ', html.unescape(re.sub('<[^>]+>', '', t or ''))).strip()

          def cle(t):
              return re.sub('[^a-z0-9]+', ' ', unicodedata.normalize('NFD', t.lower()).encode('ascii', 'ignore').decode()).strip()[:90]

          def lire(url, nav=False):
              req = urllib.request.Request(url, headers={'User-Agent': NAV if nav else 'Mozilla/5.0 (compatible; Cotes-et-Routes news robot)', 'Accept': 'application/rss+xml, application/xml, text/xml, */*', 'Accept-Language': 'fr-FR,fr;q=0.9,en;q=0.8'})
              with urllib.request.urlopen(req, timeout=40) as r:
                  return r.read()

          def analyser(b):
              """Lit le XML ; s'il est mal écrit (entités HTML comme &copy;, « & » isolés), on le répare puis on réessaie."""
              try:
                  return ET.fromstring(b)
              except ET.ParseError:
                  t = b.decode('utf-8', 'replace')
                  t = re.sub(r'&(?!(?:amp|lt|gt|quot|apos);)([a-zA-Z][a-zA-Z0-9]*);', lambda m: html.unescape(m.group(0)).replace('&', '&amp;').replace('<', '&lt;'), t)
                  t = re.sub(r'&(?!(?:[a-zA-Z][a-zA-Z0-9]*|#[0-9]+|#x[0-9a-fA-F]+);)', '&amp;', t)
                  t = re.sub(r'[\x00-\x08\x0b\x0c\x0e-\x1f]', '', t)
                  t = re.sub(r'^\s*<\?xml[^>]*\?>', '', t)
                  return ET.fromstring(t)

          def brut(b, name):
              """Dernier recours pour un flux impossible à lire en XML : on repère les articles un par un dans le texte."""
              t, items = (b.decode('utf-8', 'replace'), [])
              for bloc in re.findall(r'<(?:item|entry)[\s>](.*?)</(?:item|entry)>', t, re.S | re.I):
                  try:
                      f = lambda n: (re.search(r'<' + n + r'[^>]*>(.*?)</' + n + '>', bloc, re.S | re.I) or [None, ''])[1]
                      ti = clean(re.sub(r'<!\[CDATA\[(.*?)\]\]>', r'\1', f('title'), flags=re.S))
                      li = clean(re.sub(r'<!\[CDATA\[(.*?)\]\]>', r'\1', f('link'), flags=re.S)) or (re.search(r'<link[^>]*href="([^"]+)"', bloc) or [None, ''])[1]
                      dt = parse_date(clean(f('pubDate') or f('published') or f('updated') or f('dc:date')))
                      if ti and li.startswith('http') and dt and not EXCLU.search(ti):
                          items.append({'t': ti[:220], 'u': html.unescape(li), 'd': dt.strftime('%Y-%m-%dT%H:%MZ'), 's': name[:60]})
                  except Exception as _e_:
                      print(f'⚠️ élément ignoré : {type(_e_).__name__} {str(_e_)[:150]}', flush=True)
              if not items:
                  raise ValueError('flux illisible')
              return items

          def fetch(name, url, google=False, nav=False, nom=None):
              b = lire(url, nav)
              try:
                  root = analyser(b)
              except ET.ParseError:
                  return brut(b, nom or name)
              items = []
              for it in root.iter():
                  try:
                      if it.tag.split('}')[-1] not in ('item', 'entry'):
                          continue
                      g = lambda n: next((c for c in it if c.tag.split('}')[-1] == n), None)
                      t, l = (g('title'), g('link'))
                      link = (l.get('href') if l is not None and l.get('href') else l.text if l is not None else '') or ''
                      d = next((x for x in (g('pubDate'), g('published'), g('updated'), g('date')) if x is not None), None)
                      dt = parse_date(d.text if d is not None else '')
                      title = clean(t.text if t is not None else '')
                      src = name
                      if google:
                          s = g('source')
                          src = clean(s.text if s is not None else '') or 'Presse'
                          if title.endswith(' - ' + src):
                              title = title[:-len(src) - 3].strip()
                          src = nom or src
                      if title and link.strip().startswith('http') and dt and not EXCLU.search(title):
                          items.append({'t': title[:220], 'u': link.strip(), 'd': dt.strftime('%Y-%m-%dT%H:%MZ'), 's': src[:60]})
                  except Exception as _e_:
                      print(f'⚠️ élément ignoré : {type(_e_).__name__} {str(_e_)[:150]}', flush=True)
              return items

          def gnews(q):
              return fetch('Google Actualités', 'https://news.google.com/rss/search?' + urllib.parse.urlencode({'q': q, 'hl': 'fr', 'gl': 'FR', 'ceid': 'FR:fr'}), google=True)

          def fusionner(new, now):
              """Ajoute les nouveaux titres aux fichiers mensuels (sans doublon de lien ni de titre). Renvoie le nombre d'ajouts."""
              NDIR.mkdir(parents=True, exist_ok=True)
              limite = (now + datetime.timedelta(hours=2)).strftime('%Y-%m-%dT%H:%MZ')
              by = {}
              for x in new:
                  try:
                      if x['d'] <= limite:
                          by.setdefault(x['d'][:7], []).append(x)
                  except Exception as _e_:
                      print(f'⚠️ élément ignoré : {type(_e_).__name__} {str(_e_)[:150]}', flush=True)
              ajout = 0
              for m, lst in by.items():
                  try:
                      f = NDIR / f'{m}.json'
                      cur = json.loads(f.read_text(encoding='utf-8')) if f.exists() else {'month': m, 'items': []}
                      vus = {x['u'] for x in cur['items']} | {cle(x['t']) for x in cur['items']}
                      lst.sort(key=lambda x: x['s'] == 'Presse')
                      for x in lst:
                          k = cle(x['t'])
                          if x['u'] in vus or k in vus:
                              continue
                          vus.add(x['u'])
                          vus.add(k)
                          cur['items'].append(x)
                          ajout += 1
                      cur['items'].sort(key=lambda x: x['d'], reverse=True)
                      f.write_text(json.dumps(cur, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
                  except Exception as _e_:
                      print(f'⚠️ élément ignoré : {type(_e_).__name__} {str(_e_)[:150]}', flush=True)
              return ajout

          def ecrire_index(now):
              months, sources = ({}, {})
              for f in sorted(NDIR.glob('[0-9][0-9][0-9][0-9]-[0-9][0-9].json')):
                  try:
                      cur = json.loads(f.read_text(encoding='utf-8'))
                      its = [x for x in cur['items'] if not EXCLU.search(x.get('t', ''))]
                      if len(its) != len(cur['items']):
                          cur['items'] = its
                          f.write_text(json.dumps(cur, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
                      months[f.stem] = len(its)
                      for x in its:
                          sources[x['s']] = sources.get(x['s'], 0) + 1
                  except Exception as _e_:
                      print(f'⚠️ élément ignoré : {type(_e_).__name__} {str(_e_)[:150]}', flush=True)
              srcs = sorted(sources, key=lambda s: (-sources[s], s))
              (NDIR / 'index.json').write_text(json.dumps({'updated': now.strftime('%Y-%m-%dT%H:%MZ'), 'months': months, 'total': sum(months.values()), 'sources': srcs}, ensure_ascii=False), encoding='utf-8')
              return months, srcs

          def main():
              """Sans argument : relève les sources et met les titres de côté (/tmp/nouveaux.json).
              Avec --fusion : les range dans l'archive (lancé juste avant l'enregistrement, sur la dernière version du dépôt)."""
              LOG.parent.mkdir(parents=True, exist_ok=True)
              now = datetime.datetime.now(datetime.timezone.utc)
              T = pathlib.Path('/tmp/nouveaux.json')
              if '--fusion' in sys.argv:
                  D = json.loads(T.read_text(encoding='utf-8'))
                  ajout = fusionner(D['new'], now)
                  months, srcs = ecrire_index(now)
                  bilan = f'{ajout} nouveaux articles ; {sum(months.values())} archivés sur {len(months)} mois ; {len(srcs)} journaux différents'
                  LOG.write_text('Dernier passage : ' + now.strftime('%Y-%m-%d %H:%M UTC') + '\n' + bilan + '\n' + '\n'.join(D['rapport']) + '\n', encoding='utf-8')
                  print(bilan)
                  return
              new, ok, rapport = ([], 0, [])
              for name, url in FEEDS:
                  r, err, via = (None, '', '')
                  for u in [url] + AUTRES.get(name, []):
                      for nav in (False, True):
                          try:
                              r = fetch(name, u, nav=nav)
                              via = '' if u == url and not nav else ' (adresse ou accès de secours)'
                              break
                          except Exception as e:
                              err = f'{type(e).__name__} {str(e)[:60]}'
                      if r is not None:
                          break
                  if r is None:
                      # dernier recours : les articles du site retrouvés par Google Actualités
                      dom, r, gerr = (urllib.parse.urlparse(url).netloc.replace('www.', ''), [], '')
                      for ed in ({'hl': 'fr', 'gl': 'FR', 'ceid': 'FR:fr'}, {'hl': 'en-US', 'gl': 'US', 'ceid': 'US:en'}):  # éditions française et anglaise
                          try:
                              r += fetch(name, 'https://news.google.com/rss/search?' + urllib.parse.urlencode(dict(ed, q=f'site:{dom} when:7d')), google=True, nom=name)
                          except Exception as e:
                              gerr = f'{type(e).__name__} {str(e)[:40]}'
                          time.sleep(1)
                      if not r and gerr:
                          rapport.append(f'✘ {name} : {err} ; Google Actualités : {gerr}')
                          continue
                      via = f' (flux en panne : {err} ; articles retrouvés par Google Actualités)'
                  new += r
                  ok += 1
                  rapport.append(f'✓ {name} : {len(r)} titres{via}')
              for q in RECHERCHES:
                  try:
                      r = gnews(q + ' when:3d')
                      new += r
                      ok += 1
                      rapport.append(f'✓ Google Actualités « {q} » : {len(r)} titres')
                      time.sleep(1)
                  except Exception as e:
                      rapport.append(f'✘ Google Actualités « {q} » : {type(e).__name__} {str(e)[:80]}')
              print('\n'.join(rapport))
              if ok == 0:
                  sys.exit('Aucun flux joignable : archive conservée.')
              T.write_text(json.dumps({'new': new, 'rapport': rapport}, ensure_ascii=False), encoding='utf-8')
          if __name__ == '__main__':
              main()
          PYEOF
          python /tmp/actu.py
          git config user.name "robot-cotes-et-routes"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for essai in 1 2 3 4 5 6; do
            git fetch -q origin main && git reset -q --hard origin/main
            python /tmp/actu.py --fusion
            [ -f "$GITHUB_WORKSPACE/.github/garde.py" ] && python3 "$GITHUB_WORKSPACE/.github/garde.py" || true
            git add data/news data/logs/actualite.txt 2>/dev/null || true
            if git diff --cached --quiet; then echo "Rien de nouveau"; exit 0; fi
            git commit -qm "Actualité"
            if git push -q; then exit 0; fi
            sleep 20
          done
          exit 1
          
