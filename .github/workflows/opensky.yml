name: Vols observés (OpenSky)

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  opensky:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compter les vols observés
        env:
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
        run: |
          cat > /tmp/opensky.py <<'PYEOF'
          #!/usr/bin/env python3
          """Cotes & Routes : vols réellement observés par le réseau OpenSky (signaux ADS-B).
          Chaque jour, compte les départs observés il y a 2 jours dans les principaux aéroports
          et conserve un historique glissant de 14 jours dans data/opensky.json.
          Nécessite les secrets GitHub OPENSKY_CLIENT_ID et OPENSKY_CLIENT_SECRET (compte OpenSky gratuit)."""
          import json, os, sys, time, datetime, pathlib, gzip, urllib.request, urllib.parse, urllib.error

          TOKEN_URL = "https://auth.opensky-network.org/auth/realms/opensky-network/protocol/openid-connect/token"
          API = "https://opensky-network.org/api/flights/departure"
          OUT = pathlib.Path("data") / "opensky.json"
          N_AIRPORTS = int(os.environ.get("OPENSKY_AIRPORTS", "300"))
          MAX_ARCHIVE_MB = int(os.environ.get("OPENSKY_MAX_MB", "900"))
          KEEP_MIN_DAYS = 366  # au moins un an d’archive détaillée, quoi qu’il arrive

          def token():
              cid, sec = os.environ.get("OPENSKY_CLIENT_ID"), os.environ.get("OPENSKY_CLIENT_SECRET")
              if not cid or not sec:
                  print("Secrets OpenSky absents : étape ignorée."); sys.exit(0)
              data = urllib.parse.urlencode({"grant_type": "client_credentials", "client_id": cid, "client_secret": sec}).encode()
              with urllib.request.urlopen(urllib.request.Request(TOKEN_URL, data=data), timeout=60) as r:
                  return json.loads(r.read())["access_token"]

          def airports():
              ap = json.loads(pathlib.Path("data/airports.json").read_text(encoding="utf-8"))["airports"]
              rt = json.loads(pathlib.Path("data/routes.json").read_text(encoding="utf-8"))["routes"]
              icao = {a[0]: a[1] for a in ap if a[1] and len(a[1]) == 4}
              ranked = sorted((c for c in rt if c in icao), key=lambda c: -len(rt[c]))
              return [icao[c] for c in ranked[:N_AIRPORTS]]

          def main():
              tok, t_tok = token(), time.time()
              day = (datetime.datetime.now(datetime.timezone.utc) - datetime.timedelta(days=2)).date()
              begin = int(datetime.datetime(day.year, day.month, day.day, tzinfo=datetime.timezone.utc).timestamp())
              end = begin + 86400
              old = json.loads(OUT.read_text(encoding="utf-8")) if OUT.exists() else {"days": {}}
              res, ok, fail = {}, 0, 0
              detail = {}  # archive détaillée : [icao24, indicatif, arrivée, première détection, dernière détection]
              for i, icao in enumerate(airports()):
                  if time.time() - t_tok > 1500: tok, t_tok = token(), time.time()
                  url = f"{API}?airport={icao}&begin={begin}&end={end}"
                  try:
                      req = urllib.request.Request(url, headers={"Authorization": f"Bearer {tok}"})
                      with urllib.request.urlopen(req, timeout=120) as r:
                          flights = json.loads(r.read() or b"[]")
                  except urllib.error.HTTPError as e:
                      if e.code == 404: flights = []
                      elif e.code == 429: print("Quota OpenSky atteint, arrêt."); break
                      else: fail += 1; print(icao, "erreur", e.code); continue
                  except Exception as e:
                      fail += 1; print(icao, "erreur", e); continue
                  dest, airl = {}, {}
                  detail[icao] = [[f.get("icao24") or "", (f.get("callsign") or "").strip(), f.get("estArrivalAirport") or "", f.get("firstSeen") or 0, f.get("lastSeen") or 0] for f in flights]
                  for f in flights:
                      d = f.get("estArrivalAirport")
                      if d: dest[d] = dest.get(d, 0) + 1
                      cs = (f.get("callsign") or "").strip()
                      if len(cs) >= 4 and cs[:3].isalpha(): airl[cs[:3]] = airl.get(cs[:3], 0) + 1
                  res[icao] = {"dep": len(flights), "dest": dict(sorted(dest.items(), key=lambda x: -x[1])[:40]),
                               "airl": dict(sorted(airl.items(), key=lambda x: -x[1])[:15])}
                  ok += 1
                  time.sleep(1.5)
              # Photographie des avions en vol à un instant donné
              airborne = None
              try:
                  req = urllib.request.Request("https://opensky-network.org/api/states/all", headers={"Authorization": f"Bearer {tok}"})
                  with urllib.request.urlopen(req, timeout=120) as r:
                      st = json.loads(r.read())
                  S = [x for x in (st.get("states") or []) if x and len(x) > 8 and x[8] is False]
                  ctry = {}
                  for x in S: ctry[x[2] or "?"] = ctry.get(x[2] or "?", 0) + 1
                  airborne = {"time": st.get("time"), "total": len(S), "countries": dict(sorted(ctry.items(), key=lambda y: -y[1])[:25])}
                  print(f"{len(S)} avions en vol détectés")
              except Exception as e:
                  print("Photographie des avions en vol impossible :", e)
              if ok < 10:
                  sys.exit(f"Trop peu de réponses OpenSky ({ok}) : données conservées telles quelles.")
              days = old.get("days", {}); days[str(day)] = res
              days = dict(sorted(days.items())[-400:])
              OUT.parent.mkdir(parents=True, exist_ok=True)
              snaps = old.get("airborne", [])
              if airborne: snaps = (snaps + [airborne])[-400:]
              OUT.write_text(json.dumps({"updated": str(day), "source": "The OpenSky Network (https://opensky-network.org)", "days": days, "airborne": snaps},
                                        ensure_ascii=False, separators=(",", ":")), encoding="utf-8")
              # Archive détaillée cumulée : un fichier compressé par jour ; au moins 366 jours toujours conservés
              fdir = OUT.parent / "flights"; fdir.mkdir(parents=True, exist_ok=True)
              with gzip.open(fdir / f"{day}.json.gz", "wt", encoding="utf-8") as g:
                  json.dump({"day": str(day), "airports": detail}, g, separators=(",", ":"))
              files = sorted(fdir.glob("*.json.gz"))
              while len(files) > KEEP_MIN_DAYS and sum(f.stat().st_size for f in files) > MAX_ARCHIVE_MB * 1024 * 1024:
                  files.pop(0).unlink()
              ipath = fdir / "index.json"
              idx = json.loads(ipath.read_text(encoding="utf-8")) if ipath.exists() else {}
              days_n = idx.get("days", {}); n_today = sum(len(v) for v in detail.values()); days_n[str(day)] = n_today
              online = sorted(f.name[:10] for f in fdir.glob("*.json.gz"))
              ipath.write_text(json.dumps({"days": days_n, "online": online, "total_flights": sum(days_n.values()), "fields_per_flight": 5,
                  "fields": ["icao24", "indicatif", "arrivee_oaci", "premiere_detection_utc", "derniere_detection_utc"]}, separators=(",", ":")), encoding="utf-8")
              # Statistiques cumulées depuis le début de l'archive (chaque jour n'est compté qu'une fois)
              spath = fdir / "stats.json"
              st = json.loads(spath.read_text(encoding="utf-8")) if spath.exists() else {"counted": [], "flights": 0, "airports": {}, "pairs": {}, "airlines": {}, "hours": [0] * 24, "months": {}, "weekdays": [0] * 7}
              for k in ("ap", "al", "ty", "arr_ty"): st.setdefault(k, {})
              tmap_p = pathlib.Path("data") / "icao24-type.json"
              tmap = json.loads(tmap_p.read_text(encoding="utf-8")) if tmap_p.exists() else {}
              if str(day) not in st["counted"]:
                  def blk(d, key):
                      return d.setdefault(key, {"n": 0, "hours": [0] * 24, "weekdays": [0] * 7, "months": {}, "days": {}, "top": {}})
                  for icao, fl in detail.items():
                      st["airports"][icao] = st["airports"].get(icao, 0) + len(fl)
                      A = blk(st["ap"], icao); A["days"][str(day)] = len(fl)
                      for f in fl:
                          st["flights"] += 1; A["n"] += 1
                          cs = f[1]; pref = cs[:3] if len(cs) >= 4 and cs[:3].isalpha() else None
                          if f[2]:
                              k = icao + "|" + f[2]; st["pairs"][k] = st["pairs"].get(k, 0) + 1
                          tc = tmap.get((f[0] or "").lower())
                          if tc:
                              T = st["ty"].setdefault(tc, {"n": 0, "days": {}, "top": {}, "arr": {}, "al": {}}); T["n"] += 1
                              T.setdefault("arr", {}); T.setdefault("al", {})
                              T["days"][str(day)] = T["days"].get(str(day), 0) + 1; T["top"][icao] = T["top"].get(icao, 0) + 1
                              if f[2]: T["arr"][f[2]] = T["arr"].get(f[2], 0) + 1
                              if pref: T["al"][pref] = T["al"].get(pref, 0) + 1
                              A.setdefault("ty", {}); A["ty"][tc] = A["ty"].get(tc, 0) + 1
                              if f[2]:
                                  X = st["arr_ty"].setdefault(f[2], {}); X[tc] = X.get(tc, 0) + 1
                          if pref:
                              st["airlines"][pref] = st["airlines"].get(pref, 0) + 1
                              A["top"][pref] = A["top"].get(pref, 0) + 1
                              B = blk(st["al"], pref); B["n"] += 1; B["top"][icao] = B["top"].get(icao, 0) + 1
                              B["days"][str(day)] = B["days"].get(str(day), 0) + 1
                          if f[3]:
                              t = datetime.datetime.fromtimestamp(f[3], datetime.timezone.utc)
                              m = t.strftime("%Y-%m")
                              st["hours"][t.hour] += 1; st["weekdays"][t.weekday()] += 1; st["months"][m] = st["months"].get(m, 0) + 1
                              A["hours"][t.hour] += 1; A["weekdays"][t.weekday()] += 1; A["months"][m] = A["months"].get(m, 0) + 1
                              if pref:
                                  B["hours"][t.hour] += 1; B["weekdays"][t.weekday()] += 1; B["months"][m] = B["months"].get(m, 0) + 1
                  st["counted"].append(str(day))
                  st["pairs"] = dict(sorted(st["pairs"].items(), key=lambda x: -x[1])[:20000])
                  st["airlines"] = dict(sorted(st["airlines"].items(), key=lambda x: -x[1])[:2000])
                  for d in list(st["ap"].values()) + list(st["al"].values()):
                      d["top"] = dict(sorted(d["top"].items(), key=lambda x: -x[1])[:20])
                      d["days"] = dict(sorted(d["days"].items())[-400:])
                  st["al"] = dict(sorted(st["al"].items(), key=lambda x: -x[1]["n"])[:1500])
                  for T in st["ty"].values():
                      T["top"] = dict(sorted(T["top"].items(), key=lambda x: -x[1])[:25]); T["days"] = dict(sorted(T["days"].items())[-400:])
                      T["arr"] = dict(sorted(T.get("arr", {}).items(), key=lambda x: -x[1])[:25]); T["al"] = dict(sorted(T.get("al", {}).items(), key=lambda x: -x[1])[:25])
                  for A_ in st["ap"].values():
                      if "ty" in A_: A_["ty"] = dict(sorted(A_["ty"].items(), key=lambda x: -x[1])[:25])
                  st["arr_ty"] = {k: dict(sorted(v.items(), key=lambda x: -x[1])[:20]) for k, v in sorted(st["arr_ty"].items(), key=lambda kv: -sum(kv[1].values()))[:3000]}
              spath.write_text(json.dumps(st, separators=(",", ":")), encoding="utf-8")
              print(f"Archive : {len(online)} jours en ligne, {sum(days_n.values())} vols cumulés ({sum(days_n.values())*5} données)")
              print(f"{day} : {ok} aéroports, {sum(v['dep'] for v in res.values())} départs observés, {fail} erreurs")

          if __name__ == "__main__": main()
          PYEOF
          python /tmp/opensky.py
      - name: Enregistrer
        run: |
          git config user.name "robot-cotes-et-routes"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase || true
          git add data/opensky.json data/flights 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Vols observés OpenSky"
          git push
