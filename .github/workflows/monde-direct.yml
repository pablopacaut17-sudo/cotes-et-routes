name: Avions du monde en direct

on:
  schedule:
    - cron: "7 * * * *"
  push:
    paths:
      - ".github/workflows/monde-direct.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monde-direct
  cancel-in-progress: false

jobs:
  monde:
    runs-on: ubuntu-latest
    timeout-minutes: 62
    steps:
      - name: Photographie de tous les avions en vol (OpenSky)
        env:
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          cat > /tmp/monde.py <<'PYEOF'
          import json, os, time, urllib.request, urllib.parse, pathlib
          cid, sec = (os.environ.get('OPENSKY_CLIENT_ID'), os.environ.get('OPENSKY_CLIENT_SECRET'))
          h = {}
          if cid and sec:
              try:
                  d = urllib.parse.urlencode({'grant_type': 'client_credentials', 'client_id': cid, 'client_secret': sec}).encode()
                  with urllib.request.urlopen(urllib.request.Request('https://auth.opensky-network.org/auth/realms/opensky-network/protocol/openid-connect/token', data=d), timeout=60) as r:
                      h['Authorization'] = 'Bearer ' + json.loads(r.read())['access_token']
              except Exception as e:
                  print('Jeton OpenSky impossible :', type(e).__name__, flush=True)

          def secours():
              """Source de secours si OpenSky est en panne : airplanes.live (ADS-B ouvert), interrogé autour de 83 grandes zones de trafic."""
              vus = {}
              for la, lo in ((51.5, -0.5), (48.8, 2.4), (52.5, 13.4), (50.1, 8.7), (45.5, 9.2), (41.9, 12.5), (40.4, -3.7), (38.7, -9.1), (41.4, 2.1), (52.3, 4.8), (55.7, 12.6), (59.6, 17.9), (60.2, 24.9), (52.2, 21.0), (48.2, 16.4), (47.5, 19.1), (44.4, 26.1), (37.9, 23.7), (41.0, 28.9), (55.8, 37.6), (53.4, -6.3), (46.2, 6.1), (43.6, 1.4), (25.3, 55.4), (25.3, 51.6), (24.5, 46.7), (31.9, 35.0), (30.1, 31.4), (33.6, -7.6), (-26.1, 28.2), (-1.3, 36.9), (6.6, 3.3), (9.0, 38.8), (28.6, 77.1), (19.1, 72.9), (13.0, 77.7), (13.7, 100.7), (1.4, 104.0), (22.3, 113.9), (31.2, 121.8), (39.9, 116.4), (37.5, 126.8), (35.6, 139.8), (34.4, 135.2), (25.1, 121.2), (14.5, 121.0), (-6.1, 106.7), (3.1, 101.6), (30.6, 104.0), (23.4, 113.3), (-33.9, 151.2), (-37.7, 144.8), (-27.4, 153.1), (-31.9, 115.9), (-37.0, 174.8), (40.6, -73.8), (42.4, -71.0), (38.9, -77.4), (33.6, -84.4), (25.8, -80.3), (41.9, -87.9), (32.9, -97.0), (29.9, -95.3), (39.8, -104.7), (33.9, -118.4), (37.6, -122.4), (47.4, -122.3), (43.7, -79.6), (45.5, -73.7), (49.2, -123.2), (19.4, -99.1), (36.1, -115.2), (44.9, -93.2), (35.2, -80.9), (28.4, -81.3), (42.2, -83.4), (51.1, -114.0), (-23.4, -46.5), (-22.8, -43.2), (-34.8, -58.5), (-33.4, -70.8), (-12.0, -77.1), (4.7, -74.1)):
                  try:
                      try:
                          with urllib.request.urlopen(urllib.request.Request(f'https://api.airplanes.live/v2/point/{la}/{lo}/250', headers={'User-Agent': 'Cotes-et-Routes/1.0'}), timeout=30) as r:
                              for a in json.loads(r.read()).get('ac') or []:
                                  h = str(a.get('hex') or '').lower()
                                  if h and (not h.startswith('~')) and (a.get('lat') is not None):
                                      vus[h] = a
                      except Exception as e:
                          print('secours', la, lo, type(e).__name__, flush=True)
                      time.sleep(1.1)
                  except Exception as _e_:
                      print(f'⚠️ élément ignoré : {type(_e_).__name__} {str(_e_)[:150]}', flush=True)
              S = []
              for h, a in vus.items():
                  try:
                      alt = a.get('alt_baro')
                      sol = alt == 'ground'
                      S.append([h, (a.get('flight') or '').strip(), '', None, None, a.get('lon'), a.get('lat'), None if sol or not isinstance(alt, (int, float)) else round(alt * 0.3048), sol, None if a.get('gs') is None else a['gs'] * 0.5144, a.get('track'), None, None, None, a.get('squawk'), False, 0, a.get('t')])
                  except Exception as _e_:
                      print(f'⚠️ élément ignoré : {type(_e_).__name__} {str(_e_)[:150]}', flush=True)
              if len(S) < 500:
                  raise RuntimeError(f'secours insuffisant ({len(S)} avions)')
              return S
          st = None
          for hh in (({}, h) if h else ({},)):
              try:
                  with urllib.request.urlopen(urllib.request.Request('https://opensky-network.org/api/states/all', headers=hh), timeout=120) as r:
                      st = json.loads(r.read())
                  break
              except Exception as e:
                  print('OpenSky', 'avec compte' if hh else 'anonyme', 'indisponible :', type(e).__name__, flush=True)
          if st is None:
              print('-> secours airplanes.live', flush=True)
              st = {'states': secours(), 'time': int(time.time()), 'secours': 1}
          L = []
          for s in st.get('states') or []:
              try:
                  if not s or s[5] is None or s[6] is None:
                      continue
                  alt = s[7] if s[7] is not None else s[13]
                  L.append([s[0], (s[1] or '').strip(), round(s[6], 3), round(s[5], 3), None if alt is None else int(alt), 1 if s[8] else 0, None if s[9] is None else int(s[9] * 3.6), None if s[10] is None else int(s[10]), s[2] or ''])
              except Exception as _e_:
                  print(f'⚠️ élément ignoré : {type(_e_).__name__} {str(_e_)[:150]}', flush=True)
          out = pathlib.Path('/tmp/direct')
          out.mkdir(exist_ok=True)
          (out / 'monde.json').write_text(json.dumps({'t': st.get('time') or int(time.time()), 'n': len(L), 'champs': ['icao24', 'indicatif', 'lat', 'lon', 'altitude_m', 'au_sol', 'vitesse_kmh', 'cap', 'pays'], 'avions': L}, separators=(',', ':')), encoding='utf-8')
          print(len(L), 'avions')
          PYEOF
          cat > /tmp/detecte.py <<'PYEOF'
          """Cotes & Routes : détection des décollages et atterrissages dans le monde entier, à partir des photographies
          OpenSky des avions en vol (toutes les 5 minutes). Chaque vol complet (départ → arrivée) est ajouté aux archives horaires."""
          import json, gzip, math, pathlib, time, datetime, re, sys
          B = pathlib.Path(sys.argv[1] if len(sys.argv) > 1 else "/tmp/ancien")
          M = json.loads(pathlib.Path("/tmp/direct/monde.json").read_text())
          t1 = M["t"]; AV = M["avions"]
          AP = json.loads((B / "aeroports.json").read_text()) if (B / "aeroports.json").exists() else []
          G = {}
          for o, la, lo in AP: G.setdefault((int(la * 2), int(lo * 2)), []).append((o, la, lo))
          def km(a, b, c, d): r = math.pi / 180; return 12742 * math.asin(math.sqrt(math.sin((c - a) * r / 2) ** 2 + math.cos(a * r) * math.cos(c * r) * math.sin((d - b) * r / 2) ** 2))
          def proche(la, lo, lim):
              best = None; bd = lim
              for i in (-1, 0, 1):
                  for j in (-1, 0, 1):
                      for o, a, b in G.get((int(la * 2) + i, int(lo * 2) + j), ()):
                          d = km(la, lo, a, b)
                          if d < bd: bd, best = d, o
              return best
          EF = B / "etat.json"; E = json.loads(EF.read_text()) if EF.exists() else {"t": 0, "av": {}}
          P = E["av"]; t0 = E["t"]; N = {}; VOLS = []; nd = na = 0; PROCHE = bool(t0) and t1 - t0 <= 1200  # photographies assez rapprochées pour dater un décollage ou un atterrissage
          def bas(sol, alt): return bool(sol) or (alt is not None and alt < 900)
          for a in AV:
              try:
                  ic, cs, la, lo, alt, sol = a[0], (a[1] or "").strip(), a[2], a[3], a[4], a[5]
                  if la is None or lo is None: continue
                  b = bas(sol, alt); pres = proche(la, lo, 6 if sol else 12) if b else None
                  p = P.get(ic); dep, tdep = (p[6], p[7]) if p else (None, None)
                  if p:
                      pb = bas(p[3], p[2]); palt = p[2] if p[2] is not None else 0
                      # décollage : il était bas près d'un aéroport, il est maintenant en montée et s'en est éloigné
                      if PROCHE and pb and p[8] and not sol and alt is not None and (alt > palt + 300 or alt > 1500) and km(la, lo, p[0], p[1]) > 2:
                          dep, tdep = p[8], (t0 + t1) // 2 if t0 else t1; nd += 1
                      # atterrissage : il est maintenant bas près d'un aéroport, en descente ou au sol
                      elif PROCHE and dep and pres and pres != dep and (sol or (alt is not None and alt < palt - 150)) and tdep and t1 - tdep > 900:
                          VOLS.append([cs or p[4], ic, dep, pres, tdep, t1]); dep = tdep = None; na += 1
                  N[ic] = [la, lo, alt, sol, cs or (p[4] if p else ""), t1, dep, tdep, pres]
              except Exception as e: print("élément ignoré", e)
          # avions disparus : s'ils étaient bas près d'un aéroport après un départ connu, on compte l'atterrissage
          for ic, p in P.items():
              if ic in N: continue
              try:
                  if p[6] and p[7] and bas(p[3], p[2]) and t1 - p[5] <= 1200:
                      arr = p[8] or proche(p[0], p[1], 15)
                      if arr and arr != p[6] and p[5] - p[7] > 900: VOLS.append([p[4], ic, p[6], arr, p[7], p[5] + 180]); na += 1; continue
                  if t1 - p[5] < 3 * 3600 and p[6]: N[ic] = p
              except Exception as e: print("élément ignoré", e)
          if not E.get("v2"):  # premiers vols détectés avec des photographies trop espacées : on repart de zéro
              for f in (B / "vols").glob("*.json.gz") if (B / "vols").exists() else []: f.unlink()
          EF.write_text(json.dumps({"t": t1, "av": N, "v2": 1}, separators=(",", ":")))
          if VOLS:
              h = datetime.datetime.utcfromtimestamp(t1).strftime("%Y-%m-%d-%H"); f = B / "vols" / f"{h}.json.gz"; f.parent.mkdir(exist_ok=True)
              old = json.loads(gzip.decompress(f.read_bytes())) if f.exists() else []
              f.write_bytes(gzip.compress(json.dumps(old + VOLS, separators=(",", ":")).encode(), 6, mtime=0))
          lim = (datetime.datetime.utcfromtimestamp(t1) - datetime.timedelta(days=15)).strftime("%Y-%m-%d")
          for f in (B / "vols").glob("*.json.gz") if (B / "vols").exists() else []:
              if f.name[:10] < lim: f.unlink()
          print(f"{len(AV)} avions ; {nd} décollages et {na} vols complets détectés ; {len(N)} avions suivis")
          PYEOF
          export GIT_AUTHOR_NAME="robot-cotes-et-routes" GIT_COMMITTER_NAME="robot-cotes-et-routes" GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com" GIT_COMMITTER_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          URL="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          if git clone -q --depth 1 --branch direct "$URL" /tmp/ancien; then NEUF=0; else rm -rf /tmp/ancien; mkdir -p /tmp/ancien; git -C /tmp/ancien init -q -b direct; NEUF=1; fi
          cd /tmp/ancien
          if [ ! -s aeroports.json ]; then
            curl -sfL "https://raw.githubusercontent.com/${REPO}/main/data/airports.json" -o /tmp/ap.json && python3 -c "import json;a=json.load(open('/tmp/ap.json'))['airports'];json.dump([[x[1],x[7],x[8]] for x in a if x[1] and x[7] is not None],open('aeroports.json','w'),separators=(',',':'))" || true
          fi
          for i in $(seq 1 11); do
            debut=$(date +%s)
            if python3 /tmp/monde.py; then
              cp /tmp/direct/monde.json monde.json
              python3 /tmp/detecte.py /tmp/ancien || echo "Détection des vols impossible cette fois"
              git add -A
              if [ "$NEUF" = "1" ]; then git commit -qm "Avions du monde en direct"; NEUF=0; else git commit -q --amend -m "Avions du monde en direct"; fi
              git push -qf "$URL" HEAD:direct || echo "Envoi impossible cette fois"
            fi
            if [ "$i" -lt 11 ]; then reste=$(( 300 - $(date +%s) + debut )); if [ "$reste" -gt 0 ]; then sleep "$reste"; fi; fi
          done

          
