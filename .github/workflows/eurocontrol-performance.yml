name: "Retards, roulage, trafic et CO2 en Europe (Eurocontrol)"

on:
  schedule:
    - cron: "37 5 * * 2"
  push:
    paths:
      - ".github/workflows/eurocontrol-performance.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eurocontrol-performance
  cancel-in-progress: false

jobs:
  robot:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collecter
        run: |
          mkdir -p /tmp/robot
          cat > /tmp/robot/commun.py <<'PYEOF'
          import json, os, re, io, csv, sys, time, gzip, zipfile, bz2, datetime, pathlib, urllib.request, urllib.parse, urllib.error
          D = pathlib.Path("data"); O = D / "officiel"; O.mkdir(parents=True, exist_ok=True)
          JOUR = datetime.date.today(); LOGS = []
          UA = {"User-Agent": "Cotes-et-Routes/1.0 (site aviation ; github.com/pablopacaut17-sudo/cotes-et-routes)"}
          def log(*a):
              m = " ".join(str(x) for x in a); print(m, flush=True); LOGS.append(m)
          def get(u, t=180, data=None, h=None, essais=3):
              for k in range(essais):
                  try:
                      req = urllib.request.Request(u, data=data, headers={**UA, **(h or {})})
                      with urllib.request.urlopen(req, timeout=t) as r: return r.read()
                  except urllib.error.HTTPError as e:
                      if e.code in (400, 401, 403, 404, 410): raise
                      time.sleep(8 * (k + 1))
                  except Exception:
                      if k == essais - 1: raise
                      time.sleep(8 * (k + 1))
              raise RuntimeError("indisponible " + u)
          def gj(u, t=180, **k): return json.loads(get(u, t, **k))
          def lire(p, d=None):
              try: return json.loads(pathlib.Path(p).read_text(encoding="utf-8"))
              except Exception: return d
          def ecrire(p, o):
              p = pathlib.Path(p); p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(json.dumps(o, ensure_ascii=False, separators=(",", ":")), encoding="utf-8")
          def liens(page_url, motif, html=None):
              """liens absolus d'une page web dont l'adresse correspond au motif (expression régulière)"""
              html = html if html is not None else get(page_url, 60).decode("utf-8", "ignore")
              out = []
              for h in re.findall(r'href=["\']([^"\']+)["\']', html, re.I):
                  u = urllib.parse.urljoin(page_url, h.replace("&amp;", "&"))
                  if re.search(motif, u, re.I) and u not in out: out.append(u)
              return out
          def nombre(x):
              x = str(x or "").strip().replace(" ", "").replace("\xa0", "").replace(" ", "")
              if not x or x in ("-", ".", ".."): return None
              if re.fullmatch(r"-?\d{1,3}(,\d{3})+(\.\d+)?", x): x = x.replace(",", "")
              elif "," in x and "." not in x: x = x.replace(",", ".")
              try: return float(x)
              except ValueError: return None
          def csv_lignes(texte):
              texte = texte.lstrip("﻿"); tete = texte[:5000]
              sep = max([";", ",", "\t", "|"], key=lambda s: tete.count(s))
              return list(csv.DictReader(io.StringIO(texte), delimiter=sep))
          def decode(b):
              for enc in ("utf-8", "cp1252", "latin-1"):
                  try: return b.decode(enc)
                  except UnicodeDecodeError: pass
              return b.decode("utf-8", "ignore")
          def mois(v):
              s = str(v or "")
              m = re.search(r"(19|20)\d{2}[-/]?(0[1-9]|1[0-2])", s)
              return f"{m.group(0)[:4]}-{m.group(2)}" if m else None
          def index_aeroports():
              A = (lire(D / "airports.json", {}) or {}).get("airports", []) + (lire(D / "airports-plus.json", {}) or {}).get("airports", [])
              par_icao = {a[1]: a for a in A if a[1]}; par_iata = {a[0]: a for a in A if a[0]}
              return A, par_icao, par_iata
          def norm(s): return re.sub(r"[^a-z0-9]+", " ", str(s or "").lower().encode("ascii", "ignore").decode()).strip()
          def trouver_nom(nom, A, pays):
              """retrouve un aéroport à partir de son nom (sources qui ne donnent pas de code)"""
              n = norm(nom)
              for k in (" international", " airport", " aeroport", " intl", " regional"): n = n.replace(k.strip(), " ")
              mots = [w for w in n.split() if len(w) > 2]
              best, sc = None, 0
              for a in A:
                  if a[4] != pays: continue
                  cible = norm(a[2] + " " + a[3])
                  s = sum(1 for w in mots if w in cible.split())
                  if s > sc: best, sc = a, s
              return best if sc >= 1 and sc >= len(mots) / 2 else None
          def journal(nom):
              (D / "logs").mkdir(parents=True, exist_ok=True)
              (D / "logs" / f"{nom}.txt").write_text(f"Dernier passage : {datetime.datetime.utcnow():%Y-%m-%d %H:%M} UTC\n" + "\n".join(LOGS)[-20000:], encoding="utf-8")
          def etape(nom, f):
              t0 = time.time()
              try: f(); log(f"✔ {nom} ({round(time.time() - t0)} s)")
              except Exception as e: log(f"✘ {nom} : {type(e).__name__} {str(e)[:300]}")
          PYEOF
          cat > /tmp/robot/robot.py <<'PYEOF'
          """Cotes & Routes : retards, roulage, trafic quotidien par pays et CO2 en Europe (données ouvertes Eurocontrol)."""
          from commun import *
          BASE = "https://www.eurocontrol.int/performance/data/download/csv/"
          ANS = list(range(JOUR.year - 3, JOUR.year + 1))
          def charge(nom):
              b = get(BASE + nom, 600)
              if nom.endswith(".bz2"): b = bz2.decompress(b)
              return csv_lignes(decode(b))
          def col(cols, *motifs):
              for m in motifs:
                  for c in cols:
                      if re.fullmatch(m, c, re.I): return c
              for m in motifs:
                  for c in cols:
                      if re.search(m, c, re.I): return c
              return None
          CAUSES = {"A": "compagnie (accident/incident)", "C": "capacité du contrôle", "D": "aéroport (dégivrage)", "E": "équipement", "G": "capacité de l’aéroport", "I": "grève (contrôle)", "M": "militaire", "N": "industriel (autre)", "O": "autre", "P": "événement spécial", "R": "routes", "S": "effectifs du contrôle", "T": "équipement (aéroport)", "V": "environnement", "W": "météo", "NA": "non attribué"}
          def retards():
              R = {}
              for an in ANS:
                  try: L = charge(f"apt_dly_{an}.csv.bz2")
                  except Exception as e: log(f"retards {an} indisponibles ({str(e)[:60]})"); continue
                  cols = list(L[0].keys()); log(f"retards {an} : {len(L)} lignes")
                  for l in L:
                      ap = l.get("APT_ICAO"); m = mois(l.get("FLT_DATE")) or f"{l.get('YEAR')}-{int(l.get('MONTH_NUM') or 1):02d}"
                      if not ap: continue
                      a = R.setdefault(ap, {"nom": l.get("APT_NAME", ""), "pays": l.get("STATE_NAME", ""), "mois": {}, "causes": {}})
                      v = a["mois"].setdefault(m, [0, 0, 0, 0])
                      for i, c in enumerate(("FLT_ARR_1", "DLY_APT_ARR_1", "FLT_ARR_1_DLY", "FLT_ARR_1_DLY_15")): v[i] += nombre(l.get(c)) or 0
                      for c in cols:
                          k = re.match(r"DLY_APT_ARR_(\w+?)_1$", c)
                          if k and k.group(1) in CAUSES: a["causes"][k.group(1)] = a["causes"].get(k.group(1), 0) + (nombre(l[c]) or 0)
              for a in R.values():
                  a["mois"] = {k: [round(x) for x in v] for k, v in sorted(a["mois"].items())}; a["causes"] = {k: round(v) for k, v in a["causes"].items() if v}
              if not R: raise RuntimeError("aucune donnée de retard")
              ecrire(O / "retards-europe.json", {"maj": JOUR.isoformat(), "source": "Eurocontrol, retards ATFM à l’arrivée par aéroport", "url": "https://ansperformance.eu/", "licence": "Données ouvertes Eurocontrol (réutilisation avec mention)",
                  "champs": ["arrivees", "minutes_de_retard", "vols_retardes", "vols_retardes_plus_15_min"], "causes": CAUSES, "aeroports": R})
          def trafic_pays():
              P = {}
              for an in range(2019, JOUR.year + 1):
                  try: L = charge(f"airport_traffic_{an}.csv")
                  except Exception as e: log(f"trafic {an} indisponible ({str(e)[:60]})"); continue
                  cols = list(L[0].keys()); ct = col(cols, r"FLT_TOT_1", r"FLT_TOT"); cs = col(cols, r"STATE_NAME"); cd = col(cols, r"FLT_DATE")
                  for l in L:
                      j = (l.get(cd) or "")[:10]; s = l.get(cs)
                      if j and s: P.setdefault(s, {}); P[s][j] = P[s].get(j, 0) + (nombre(l.get(ct)) or 0)
                  log(f"trafic {an} : {len(L)} lignes")
              if not P: raise RuntimeError("aucune donnée de trafic")
              ecrire(O / "trafic-pays-europe.json", {"maj": JOUR.isoformat(), "source": "Eurocontrol, mouvements quotidiens des aéroports (somme par pays)", "url": "https://ansperformance.eu/", "note": "Décollages + atterrissages des aéroports suivis, par jour",
                  "pays": {s: {j: round(v) for j, v in sorted(d.items())} for s, d in P.items()}})
          def roulage():
              R = {}
              for an in ANS:
                  try: L = charge(f"taxi_out_additional_time_{an}.csv")
                  except Exception as e: log(f"roulage {an} indisponible ({str(e)[:60]})"); continue
                  cols = list(L[0].keys()); log(f"roulage {an} colonnes : {cols[:12]}")
                  ca = col(cols, r"APT_ICAO"); cf = col(cols, r"TOT_REF_NB_FL", r"NB_FL", r"FL"); cx = col(cols, r"TOT_ADD_TIME_MIN", r"ADD.*TIME", r"ADD")
                  cy = col(cols, r"YEAR"); cm = col(cols, r"MONTH_NUM", r"MONTH")
                  for l in L:
                      ap = l.get(ca); f = nombre(l.get(cf)) or 0; x = nombre(l.get(cx)) or 0
                      if not ap or not f: continue
                      m = f"{l.get(cy)}-{int(nombre(l.get(cm)) or 1):02d}"
                      v = R.setdefault(ap, {}).setdefault(m, [0, 0]); v[0] += f; v[1] += x
              if not R: raise RuntimeError("aucune donnée de roulage")
              ecrire(O / "roulage-europe.json", {"maj": JOUR.isoformat(), "source": "Eurocontrol, temps de roulage supplémentaire au départ", "url": "https://ansperformance.eu/", "champs": ["vols", "minutes_supplementaires"],
                  "aeroports": {a: {m: [round(v[0]), round(v[1])] for m, v in sorted(d.items())} for a, d in R.items()}})
          def co2():
              P = {}
              for an in range(2010, JOUR.year + 1):
                  try: L = charge(f"co2_emmissions_by_state_{an}.csv")
                  except Exception as e: log(f"CO2 {an} indisponible ({str(e)[:60]})"); continue
                  cols = list(L[0].keys()); cs = col(cols, r"STATE_NAME", r"STATE"); cc = col(cols, r"CO2_QTY_TONNES", r"CO2"); cf = col(cols, r"TF", r"FLIGHTS")
                  for l in L:
                      s = l.get(cs)
                      if not s: continue
                      v = P.setdefault(s, {}).setdefault(str(an), [0, 0]); v[0] += nombre(l.get(cc)) or 0; v[1] += nombre(l.get(cf)) or 0 if cf else 0
                  log(f"CO2 {an} : {len(L)} lignes, colonnes {cols[:8]}")
              if not P: raise RuntimeError("aucune donnée CO2")
              ecrire(O / "co2-europe.json", {"maj": JOUR.isoformat(), "source": "Eurocontrol, émissions de CO2 des vols au départ de chaque pays", "url": "https://ansperformance.eu/", "champs": ["tonnes_co2", "vols"],
                  "pays": {s: {a: [round(v[0]), round(v[1])] for a, v in sorted(d.items())} for s, d in P.items()}})
          for nom, f in (("Retards par aéroport", retards), ("Trafic quotidien par pays", trafic_pays), ("Temps de roulage", roulage), ("CO2 par pays", co2)):
              etape(nom, f)
          journal("eurocontrol-performance")
          PYEOF
          PYTHONPATH=/tmp/robot python /tmp/robot/robot.py
      - name: Enregistrer
        if: always()
        run: |
          git config user.name "robot-cotes-et-routes"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then echo "Rien de nouveau"; exit 0; fi
          git commit -qm "Retards, roulage, trafic et CO2 en Europe"
          for essai in 1 2 3 4 5 6; do
            if git push; then exit 0; fi
            sleep 15
            git pull -q --rebase -X theirs origin main || git rebase --abort
          done
          exit 1
          
